<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnevno Čitanje & Blog</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 650px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .lang-switch {
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #3498db;
      background: white;
      color: #3498db;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #3498db;
      color: white;
    }
    .tab-navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 6px;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 8px;
      cursor: pointer;
      flex: 1 1 auto;
      text-align: center;
    }
    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }
    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    button, input[type="text"], input[type="password"], input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button { cursor: pointer; }
    .btn-main { background-color: #3498db; color: white; border: none; }
    .btn-purple { background-color: #9b59b6; color: white; border: none; }
    .toolbar { display: flex; gap: 5px; margin-bottom: 8px; }
    .btn-bold { background-color: #27ae60; color: white; border: none; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
    .btn-italic { background-color: #f39c12; color: white; border: none; font-style: italic; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
    textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }
    .display-area {
      min-height: 200px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
    }
    .blog-item {
      background: #ffffff;
      border: 1px solid #e1e8ed;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .blog-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .blog-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 0; }
    .blog-date { font-size: 12px; color: #888; }
    .blog-body { font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
    .controls { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .pin-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .hidden { display: none !important; }
    .status { font-size: 14px; color: #666; text-align: right; margin-top: 5px; }
    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
    .footer a { color: #3498db; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div style="font-weight: bold; color: #555;" id="appTitle">Biblijsko Čitanje</div>
      <div class="lang-switch">
        <button id="langSrbBtn" class="lang-btn active" onclick="setLanguage('sr')">SRB</button>
        <button id="langEngBtn" class="lang-btn" onclick="setLanguage('en')">ENG</button>
      </div>
    </div>

    <div class="date-navigation" id="dateNav">
      <button class="btn-main" onclick="changeDate(-1)">◀</button>
      <input type="date" id="datePicker" onchange="loadAllTabs()">
      <button class="btn-main" onclick="changeDate(1)">▶</button>
    </div>

    <div class="tab-navigation">
      <button id="tabDailyBtn" class="tab-btn active" onclick="switchTab('daily')">📖 Dnevno Čitanje</button>
      <button id="tabConsiderBtn" class="tab-btn" onclick="switchTab('consider')">🕊️ Duhovna Razmatranja</button>
      <button id="tabPlanBtn" class="tab-btn" onclick="switchTab('plan')">📜 Plan</button>
      <button id="tabVerseBtn" class="tab-btn" onclick="switchTab('verse')">💎 Stih</button>
      <button id="tabQuoteBtn" class="tab-btn" onclick="switchTab('quote')">💡 Izreke</button>
      <button id="tabBlogBtn" class="tab-btn" onclick="switchTab('blog')">✍️ Blog</button>
    </div>

    <div id="pinContainer" class="pin-box hidden">
      <input type="password" id="pinInput" placeholder="Unesite šifru (1234)" style="flex: 1;">
      <button class="btn-main" onclick="confirmPin()">Potvrdi</button>
      <button onclick="cancelPin()">X</button>
    </div>

    <div id="dailySection">
      <div id="dailyViewMode">
        <div id="dailyDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="dailyShareBtn" class="btn-purple" onclick="shareContent('daily')">📦 Podeli</button>
          <button id="dailyEditBtn" class="btn-main" onclick="startEdit('daily')">⚙️ Uredi</button>
        </div>
      </div>
      <div id="dailyEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('dailyTextarea')"><b>B</b> Bold</button>
          <button class="btn-italic" onclick="makeItalic('dailyTextarea')"><i>I</i> Italic</button>
        </div>
        <textarea id="dailyTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="dailySaveStatus" class="status"></div>
        <div class="controls">
          <button id="dailyCancelBtn" onclick="cancelEdit('daily')">Otkaži</button>
          <button id="dailySaveBtn" class="btn-main" onclick="saveTabContent('daily')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <div id="considerSection" class="hidden">
      <div id="considerViewMode">
        <div id="considerDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="considerShareBtn" class="btn-purple" onclick="shareContent('consider')">📦 Podeli</button>
          <button id="considerEditBtn" class="btn-main" onclick="startEdit('consider')">⚙️ Uredi</button>
        </div>
      </div>
      <div id="considerEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('considerTextarea')"><b>B</b> Bold</button>
          <button class="btn-italic" onclick="makeItalic('considerTextarea')"><i>I</i> Italic</button>
        </div>
        <textarea id="considerTextarea" placeholder="Unesite duhovno razmatranje..."></textarea>
        <div id="considerSaveStatus" class="status"></div>
        <div class="controls">
          <button id="considerCancelBtn" onclick="cancelEdit('consider')">Otkaži</button>
          <button id="considerSaveBtn" class="btn-main" onclick="saveTabContent('consider')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <div id="planSection" class="hidden">
      <div id="planViewMode">
        <div id="planDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="planShareBtn" class="btn-purple" onclick="shareContent('plan')">📦 Podeli</button>
          <button id="planEditBtn" class="btn-main" onclick="startEdit('plan')">⚙️ Uredi</button>
        </div>
      </div>
      <div id="planEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('planTextarea')"><b>B</b> Bold</button>
          <button class="btn-italic" onclick="makeItalic('planTextarea')"><i>I</i> Italic</button>
        </div>
        <textarea id="planTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="planSaveStatus" class="status"></div>
        <div class="controls">
          <button id="planCancelBtn" onclick="cancelEdit('plan')">Otkaži</button>
          <button id="planSaveBtn" class="btn-main" onclick="saveTabContent('plan')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <div id="verseSection" class="hidden">
      <div id="verseViewMode">
        <div id="verseDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="verseShareBtn" class="btn-purple" onclick="shareContent('verse')">📦 Podeli</button>
          <button id="verseEditBtn" class="btn-main" onclick="startEdit('verse')">⚙️ Uredi</button>
        </div>
      </div>
      <div id="verseEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('verseTextarea')"><b>B</b> Bold</button>
          <button class="btn-italic" onclick="makeItalic('verseTextarea')"><i>I</i> Italic</button>
        </div>
        <textarea id="verseTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="verseSaveStatus" class="status"></div>
        <div class="controls">
          <button id="verseCancelBtn" onclick="cancelEdit('verse')">Otkaži</button>
          <button id="verseSaveBtn" class="btn-main" onclick="saveTabContent('verse')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <div id="quoteSection" class="hidden">
      <div id="quoteViewMode">
        <div id="quoteDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="quoteShareBtn" class="btn-purple" onclick="shareContent('quote')">📦 Podeli</button>
          <button id="quoteEditBtn" class="btn-main" onclick="startEdit('quote')">⚙️ Uredi</button>
        </div>
      </div>
      <div id="quoteEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('quoteTextarea')"><b>B</b> Bold</button>
          <button class="btn-italic" onclick="makeItalic('quoteTextarea')"><i>I</i> Italic</button>
        </div>
        <textarea id="quoteTextarea" placeholder="Unesite mudru izreku..."></textarea>
        <div id="quoteSaveStatus" class="status"></div>
        <div class="controls">
          <button id="quoteCancelBtn" onclick="cancelEdit('quote')">Otkaži</button>
          <button id="quoteSaveBtn" class="btn-main" onclick="saveTabContent('quote')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <div id="blogSection" class="hidden">
      <div class="controls" style="margin-bottom: 15px;">
        <button id="blogNewBtn" class="btn-main" onclick="startBlogEdit()">➕ Nova objava</button>
      </div>

      <div id="blogEditMode" class="hidden" style="margin-bottom: 25px; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
        <input type="text" id="blogTitleInput" placeholder="Naslov objave..." style="width: 100%; box-sizing: border-box; margin-bottom: 10px;">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('blogTextarea')"><b>B</b> Bold</button>
          <button class="btn-italic" onclick="makeItalic('blogTextarea')"><i>I</i> Italic</button>
        </div>
        <textarea id="blogTextarea" placeholder="Sadržaj objave..."></textarea>
        <div id="blogSaveStatus" class="status"></div>
        <div class="controls">
          <button id="blogCancelBtn" onclick="cancelBlogEdit()">Otkaži</button>
          <button id="blogSaveBtn" class="btn-main" onclick="saveBlogPost()">Objavi</button>
        </div>
      </div>

      <div id="blogContainer">Učitavanje bloga...</div>
    </div>

    <div class="footer">
      <span id="authorText">Autor: Ivica Vučković</span> | 
      <span id="contactText">Kontakt:</span> <a id="emailLink" href="mailto:slugaisusahristosa@gmail.com">slugaisusahristosa@gmail.com</a>
    </div>

  </div>

    const datePicker = document.getElementById('datePicker');

    function initDate() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      datePicker.value = `${year}-${month}-${day}`;
    }

    function startEdit(tab) {
      pendingAction = { type: 'tab', tab: tab };
      document.getElementById('pinInput').value = '';
      document.getElementById('pinContainer').classList.remove('hidden');
    }

    function startBlogEdit() {
      pendingAction = { type: 'blog' };
      document.getElementById('pinInput').value = '';
      document.getElementById('pinContainer').classList.remove('hidden');
    }

    function cancelPin() {
      document.getElementById('pinContainer').classList.add('hidden');
      pendingAction = null;
    }

    function confirmPin() {
      const inputPin = document.getElementById('pinInput').value;
      const t = translations[currentLang];

      if (inputPin !== MOJA_SIFRA) {
        alert(t.wrongPass);
        return;
      }

      document.getElementById('pinContainer').classList.add('hidden');

      if (pendingAction && pendingAction.type === 'tab') {
        enableEditMode(pendingAction.tab);
      } else if (pendingAction && pendingAction.type === 'blog') {
        enableBlogEditMode();
      }
      pendingAction = null;
    }

    function enableEditMode(tab) {
      const displayElem = document.getElementById(`${tab}Display`);
      const textareaElem = document.getElementById(`${tab}Textarea`);
      const viewElem = document.getElementById(`${tab}ViewMode`);
      const editElem = document.getElementById(`${tab}EditMode`);

      const txt = displayElem.innerHTML;
      const isNullText = txt.includes("Nema unetog") || txt.includes("No ") || txt.includes("Učitavanje");
      textareaElem.value = isNullText ? "" : txt;

      viewElem.classList.add('hidden');
      editElem.classList.remove('hidden');
    }

    function enableBlogEditMode() {
      document.getElementById('blogTitleInput').value = '';
      document.getElementById('blogTextarea').value = '';
      document.getElementById('blogEditMode').classList.remove('hidden');
    }

    function makeBold(textareaId) {
      const txtArea = document.getElementById(textareaId);
      const start = txtArea.selectionStart;
      const end = txtArea.selectionEnd;
      const selText = txtArea.value.substring(start, end);

      if (selText.length > 0) {
        txtArea.value = txtArea.value.substring(0, start) + `<b>${selText}</b>` + txtArea.value.substring(end);
      } else {
        txtArea.value += "<b>Podebljani tekst</b>";
      }
    }

    function makeItalic(textareaId) {
      const txtArea = document.getElementById(textareaId);
      const start = txtArea.selectionStart;
      const end = txtArea.selectionEnd;
      const selText = txtArea.value.substring(start, end);

      if (selText.length > 0) {
        txtArea.value = txtArea.value.substring(0, start) + `<i>${selText}</i>` + txtArea.value.substring(end);
      } else {
        txtArea.value += "<i>Iskošeni tekst</i>";
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'sr') {
        document.getElementById('langSrbBtn').classList.add('active');
        document.getElementById('langEngBtn').classList.remove('active');
      } else {
        document.getElementById('langSrbBtn').classList.remove('active');
        document.getElementById('langEngBtn').classList.add('active');
      }
      applyTranslations();
      loadAllTabs();
    }

    function applyTranslations() {
      const t = translations[currentLang];
      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('tabDailyBtn').textContent = t.tabDaily;
      document.getElementById('tabConsiderBtn').textContent = t.tabConsider;
      document.getElementById('tabPlanBtn').textContent = t.tabPlan;
      document.getElementById('tabVerseBtn').textContent = t.tabVerse;
      document.getElementById('tabQuoteBtn').textContent = t.tabQuote;
      document.getElementById('tabBlogBtn').textContent = t.tabBlog;
      document.getElementById('authorText').textContent = t.author;
      document.getElementById('contactText').textContent = t.contact;
      document.getElementById('blogNewBtn').textContent = t.newPost;

        document.getElementById(`${tab}ShareBtn`).textContent = t.share;
        document.getElementById(`${tab}EditBtn`).textContent = t.edit;
        document.getElementById(`${tab}CancelBtn`).textContent = t.cancel;
        document.getElementById(`${tab}SaveBtn`).textContent = t.save;
