<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnevno Čitanje & Plan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }
    .tab-navigation {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
    }
    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }
    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    button, input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .btn-main {
      background-color: #3498db;
      color: white;
      border: none;
    }
    .btn-purple {
      background-color: #9b59b6;
      color: white;
      border: none;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }
    .display-area {
      min-height: 250px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .hidden {
      display: none;
    }
    .status {
      font-size: 14px;
      color: #666;
      text-align: right;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigacija između tabova -->
    <div class="tab-navigation">
      <button id="tabDailyBtn" class="tab-btn active" onclick="switchTab('daily')">📖 Dnevno Čitanje</button>
      <button id="tabPlanBtn" class="tab-btn" onclick="switchTab('plan')">📜 Godišnji Plan</button>
    </div>

    <!-- PROZOR 1: Dnevno čitanje -->
    <div id="dailySection">
      <div class="date-navigation">
        <button class="btn-main" onclick="changeDate(-1)">◀</button>
        <input type="date" id="datePicker" onchange="loadContent()">
        <button class="btn-main" onclick="changeDate(1)">▶</button>
      </div>

      <div id="viewMode">
        <div id="contentDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button class="btn-purple" onclick="shareContent(contentDisplay.textContent)">📦 Podeli</button>
          <button class="btn-main" onclick="enableEdit()">⚙️ Uredi</button>
        </div>
      </div>

      <div id="editMode" class="hidden">
        <textarea id="contentTextarea" placeholder="Unesite tekst za izabrani datum..."></textarea>
        <div id="saveStatus" class="status"></div>
        <div class="controls">
          <button onclick="cancelEdit()">Otkaži</button>
          <button class="btn-main" onclick="saveContent()">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- PROZOR 2: Godišnji plan čitanja Biblije -->
    <div id="planSection" class="hidden">
      <h1>📜 Godišnji plan čitanja Biblije</h1>

      <div id="planViewMode">
        <div id="planDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button class="btn-purple" onclick="shareContent(planDisplay.textContent)">📦 Podeli</button>
          <button class="btn-main" onclick="enablePlanEdit()">⚙️ Uredi Plan</button>
        </div>
      </div>

      <div id="planEditMode" class="hidden">
        <textarea id="planTextarea" placeholder="Unesite godišnji plan čitanja Biblije..."></textarea>
        <div id="planSaveStatus" class="status"></div>
        <div class="controls">
          <button onclick="cancelPlanEdit()">Otkaži</button>
          <button class="btn-main" onclick="savePlanContent()">Sačuvaj Plan</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tkwxklzhjvccgszxkxsy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XJ1E7HAtQNXSYCMtCeCk6A_78hqKMEo';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Šifra za uređivanje
    const MOJA_SIFRA = '1234';

    const datePicker = document.getElementById('datePicker');
    const contentDisplay = document.getElementById('contentDisplay');
    const contentTextarea = document.getElementById('contentTextarea');
    const viewMode = document.getElementById('viewMode');
    const editMode = document.getElementById('editMode');
    const saveStatus = document.getElementById('saveStatus');

    const planDisplay = document.getElementById('planDisplay');
    const planTextarea = document.getElementById('planTextarea');
    const planViewMode = document.getElementById('planViewMode');
    const planEditMode = document.getElementById('planEditMode');
    const planSaveStatus = document.getElementById('planSaveStatus');

    const today = new Date().toISOString().split('T')[0];
    datePicker.value = today;

    // Promena taba (Dnevno čitanje / Godišnji plan)
    function switchTab(tab) {
      if (tab === 'daily') {
        document.getElementById('dailySection').classList.remove('hidden');
        document.getElementById('planSection').classList.add('hidden');
        document.getElementById('tabDailyBtn').classList.add('active');
        document.getElementById('tabPlanBtn').classList.remove('active');
      } else {
        document.getElementById('dailySection').classList.add('hidden');
        document.getElementById('planSection').classList.remove('hidden');
        document.getElementById('tabDailyBtn').classList.remove('active');
        document.getElementById('tabPlanBtn').classList.add('active');
        loadPlanContent();
      }
    }

    // --- LOGIKA ZA DNEVNO ČITANJE ---
    async function loadContent() {
      const selectedDate = datePicker.value;
      contentDisplay.textContent = "Učitavanje...";

      const { data, error } = await _supabase
        .from('citanja')
        .select('tekst')
        .eq('datum', selectedDate)
        .maybeSingle();

      if (error) console.error("Greška pri preuzimanju:", error);

      if (data && data.tekst) {
        contentDisplay.textContent = data.tekst;
      } else {
        contentDisplay.textContent = "Nema unetog teksta za ovaj datum.";
      }
    }

    function enableEdit() {
      const unetaSifra = prompt("Unesite šifru za uređivanje:");
      if (unetaSifra !== MOJA_SIFRA) {
        alert("Pogrešna šifra! Samo administrator može uređivati tekst.");
        return;
      }

      const currentText = contentDisplay.textContent.includes("Nema unetog teksta") ? "" : contentDisplay.textContent;
      contentTextarea.value = currentText;
      viewMode.classList.add('hidden');
      editMode.classList.remove('hidden');
    }

    async function saveContent() {
      const selectedDate = datePicker.value;
      const newText = contentTextarea.value;
      saveStatus.textContent = "Čuvanje...";

      const { error } = await _supabase
        .from('citanja')
        .upsert({ datum: selectedDate, tekst: newText }, { onConflict: 'datum' });

      if (error) {
        alert("Greška pri čuvanju: " + error.message);
        saveStatus.textContent = "";
      } else {
        saveStatus.textContent = "";
        contentDisplay.textContent = newText || "Nema unetog teksta za ovaj datum.";
        editMode.classList.add('hidden');
        viewMode.classList.remove('hidden');
      }
    }

    function changeDate(days) {
      const currentDate = new Date(datePicker.value);
      currentDate.setDate(currentDate.getDate() + days);
      datePicker.value = currentDate.toISOString().split('T')[0];
      loadContent();
    }

    function cancelEdit() {
      editMode.classList.add('hidden');
      viewMode.classList.remove('hidden');
    }

    // --- LOGIKA ZA GODIŠNJI PLAN ---
    async function loadPlanContent() {
      planDisplay.textContent = "Učitavanje plana...";

      const { data, error } = await _supabase
        .from('citanja')
        .select('tekst')
        .eq('datum', 'godisnji_plan')
        .maybeSingle();

      if (error) console.error("Greška pri preuzimanju plana:", error);

      if (data && data.tekst) {
        planDisplay.textContent = data.tekst;
      } else {
        planDisplay.textContent = "Godišnji plan čitanja još uvek nije unet. Kliknite na '⚙️ Uredi Plan' da ga dodate.";
      }
    }

    function enablePlanEdit() {
      const unetaSifra = prompt("Unesite šifru za uređivanje plana:");
      if (unetaSifra !== MOJA_SIFRA) {
        alert("Pogrešna šifra!");
        return;
      }

      const currentText = planDisplay.textContent.includes("Godišnji plan čitanja još uvek nije unet") ? "" : planDisplay.textContent;
      planTextarea.value = currentText;
      planViewMode.classList.add('hidden');
      planEditMode.classList.remove('hidden');
    }

    async function savePlanContent() {
      const newText = planTextarea.value;
      planSaveStatus.textContent = "Čuvanje...";

      const { error } = await _supabase
        .from('citanja')
        .upsert({ datum: 'godisnji_plan', tekst: newText }, { onConflict: 'datum' });

      if (error) {
        alert("Greška pri čuvanju: " + error.message);
        planSaveStatus.textContent = "";
      } else {
        planSaveStatus.textContent = "";
        planDisplay.textContent = newText || "Godišnji plan čitanja još uvek nije unet.";
        planEditMode.classList.add('hidden');
        planViewMode.classList.remove('hidden');
      }
    }

    function cancelPlanEdit() {
      planEditMode.classList.add('hidden');
      planViewMode.classList.remove('hidden');
    }

    // Sharing funkcija
    function shareContent(textToShare) {
      if (navigator.share) {
        navigator.share({
          title: 'Biblijsko Čitanje',
          text: textToShare,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(textToShare);
        alert("Tekst je kopiran u međuspremnik!");
      }
    }

    loadContent();
  </script>
</body>
</html>
