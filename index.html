<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dnevno Čitanje</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1ea;
    color: #333;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    min-height: 100vh;
    padding: 15px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: 25px;
    color: #4b3621;
}

.lang {
    display: flex;
    gap: 5px;
}

.lang button {
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.lang button.active {
    background: #4b3621;
    color: white;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 15px;
}

.tab {
    flex: 1 1 150px;
    padding: 11px 8px;
    border: none;
    border-radius: 7px;
    background: #e6e0d5;
    cursor: pointer;
    font-size: 14px;
}

.tab.active {
    background: #6b4f2a;
    color: white;
}

.date-area {
    text-align: center;
    margin-bottom: 15px;
}

.date-area input {
    padding: 9px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

.date-buttons {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.date-buttons button {
    padding: 8px 15px;
    border: none;
    border-radius: 6px;
    background: #6b4f2a;
    color: white;
    cursor: pointer;
}

.content-box {
    background: #faf8f3;
    border: 1px solid #ddd4c6;
    border-radius: 10px;
    padding: 20px;
    min-height: 300px;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 17px;
}

.toolbar {
    display: none;
    gap: 5px;
    margin-bottom: 8px;
}

.toolbar button {
    padding: 7px 12px;
    border: 1px solid #bbb;
    background: white;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 300px;
    padding: 15px;
    font-size: 17px;
    line-height: 1.6;
    border: 1px solid #bbb;
    border-radius: 8px;
    resize: vertical;
}

.controls {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.controls button {
    padding: 9px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.edit {
    background: #6b4f2a;
    color: white;
}

.share {
    background: #4b7f52;
    color: white;
}

.save {
    background: #287a45;
    color: white;
}

.cancel {
    background: #999;
    color: white;
}

.status {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #777;
}

footer {
    text-align: center;
    margin-top: 30px;
    color: #888;
    font-size: 13px;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <h1 id="appTitle">📖 Dnevno Čitanje</h1>

        <div class="lang">
            <button id="srBtn" class="active" onclick="setLanguage('sr')">SR</button>
            <button id="enBtn" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <div class="tabs">

        <button class="tab active" id="tab-dnevno" onclick="switchTab('dnevno')">
            📖 Dnevno Čitanje
        </button>

        <button class="tab" id="tab-plan" onclick="switchTab('plan')">
            📜 Godišnji Plan
        </button>

        <button class="tab" id="tab-stih" onclick="switchTab('stih')">
            💎 Stih Ohrabrenja
        </button>

        <button class="tab" id="tab-izreka" onclick="switchTab('izreka')">
            💡 Mudre Izreke
        </button>

        <button class="tab" id="tab-duhovno" onclick="switchTab('duhovno')">
            🕊️ Duhovna Razmatranja
        </button>

    </div>

    <div class="date-area">

        <input type="date" id="datePicker" onchange="changeDate()">

        <div class="date-buttons">
            <button onclick="changeDateBy(-1)">◀</button>
            <button onclick="goToday()" id="todayBtn">Danas</button>
            <button onclick="changeDateBy(1)">▶</button>
        </div>

    </div>

    <div id="displayBox" class="content-box">
        Učitavanje...
    </div>

    <div id="editArea" class="hidden">

        <div class="toolbar">
            <button onclick="makeBold()">B</button>
            <button onclick="makeItalic()"><i>I</i></button>
        </div>

        <textarea id="editor"></textarea>

        <div class="controls">
            <button class="save" onclick="saveTabContent()" id="saveBtn">
                Sačuvaj
            </button>

            <button class="cancel" onclick="cancelEdit()" id="cancelBtn">
                Otkaži
            </button>
        </div>

    </div>

    <div class="controls" id="mainControls">

        <button class="share" onclick="shareContent()" id="shareBtn">
            📤 Podeli
        </button>

        <button class="edit" onclick="enableEdit()" id="editBtn">
            ✏️ Uredi
        </button>

    </div>

    <div id="status" class="status"></div>

    <footer>
        © Dnevno Čitanje
    </footer>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = 'https://tkwxklzhjvccgszxkxsy.supabase.co';

const SUPABASE_KEY =
'sb_publishable_XJ1E7HAtQNXSYCMtCeCk6A_78hqKMEo';

const _supabase = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   PODEŠAVANJA
   ========================================================= */

const MOJA_SIFRA = '1234';

let currentTab = 'dnevno';

let currentLanguage = 'sr';

let currentDate =
    new Date().toISOString().split('T')[0];

let currentText = '';


/* =========================================================
   PREVODI
   ========================================================= */

const translations = {

    sr: {
        title: '📖 Dnevno Čitanje',

        dnevno: '📖 Dnevno Čitanje',
        plan: '📜 Godišnji Plan',
        stih: '💎 Stih Ohrabrenja',
        izreka: '💡 Mudre Izreke',
        duhovno: '🕊️ Duhovna Razmatranja',

        today: 'Danas',
        share: '📤 Podeli',
        edit: '✏️ Uredi',
        save: 'Sačuvaj',
        cancel: 'Otkaži',

        loading: 'Učitavanje...',
        noText: 'Za ovaj datum još nema unetog teksta.',
        saved: 'Tekst je uspešno sačuvan.',
        password: 'Unesite šifru:',
        wrongPassword: 'Pogrešna šifra.',
        error: 'Došlo je do greške.'
    },

    en: {
        title: '📖 Daily Reading',

        dnevno: '📖 Daily Reading',
        plan: '📜 Annual Plan',
        stih: '💎 Verse of Encouragement',
        izreka: '💡 Wise Sayings',
        duhovno: '🕊️ Spiritual Reflections',

        today: 'Today',
        share: '📤 Share',
        edit: '✏️ Edit',
        save: 'Save',
        cancel: 'Cancel',

        loading: 'Loading...',
        noText: 'There is no text entered for this date yet.',
        saved: 'Text has been successfully saved.',
        password: 'Enter password:',
        wrongPassword: 'Wrong password.',
        error: 'An error occurred.'
    }

};


/* =========================================================
   PRIMENA PREVODA
   ========================================================= */

function applyTranslations() {

    const t = translations[currentLanguage];

    document.getElementById('appTitle').textContent = t.title;

    document.getElementById('tab-dnevno').textContent = t.dnevno;
    document.getElementById('tab-plan').textContent = t.plan;
    document.getElementById('tab-stih').textContent = t.stih;
    document.getElementById('tab-izreka').textContent = t.izreka;
    document.getElementById('tab-duhovno').textContent = t.duhovno;

    document.getElementById('todayBtn').textContent = t.today;
    document.getElementById('shareBtn').textContent = t.share;
    document.getElementById('editBtn').textContent = t.edit;
    document.getElementById('saveBtn').textContent = t.save;
    document.getElementById('cancelBtn').textContent = t.cancel;
}


/* =========================================================
   JEZIK
   ========================================================= */

function setLanguage(lang) {

    currentLanguage = lang;

    document.getElementById('srBtn')
        .classList.toggle('active', lang === 'sr');

    document.getElementById('enBtn')
        .classList.toggle('active', lang === 'en');

    applyTranslations();

    loadTabContent();
}


/* =========================================================
   TABOVI
   ========================================================= */

function switchTab(tab) {

    currentTab = tab;

    document.querySelectorAll('.tab')
        .forEach(button => button.classList.remove('active'));

    document.getElementById('tab-' + tab)
        .classList.add('active');

    document.getElementById('editArea')
        .classList.add('hidden');

    document.getElementById('mainControls')
        .classList.remove('hidden');

    loadTabContent();
}


/* =========================================================
   DATUM
   ========================================================= */

function getDatePart() {

    const parts = currentDate.split('-');

    return parts[1] + '-' + parts[2];
}


/* =========================================================
   KLJUČEVI
   ========================================================= */

function getKeysToSearch() {

    const datePart = getDatePart();

    let prefix = '';

    if (currentTab === 'dnevno') {
        prefix = '';
    }

    if (currentTab === 'plan') {
        prefix = 'plan_';
    }

    if (currentTab === 'stih') {
        prefix = 'stih_';
    }

    if (currentTab === 'izreka') {
        prefix = 'izreka_';
    }

    if (currentTab === 'duhovno') {
        prefix = 'duhovno_';
    }

    const key = prefix + datePart;

    const englishKey =
        'en_' + prefix + datePart;

    if (currentLanguage === 'en') {
        return [englishKey, key];
    }

    return [key];

}


/* =========================================================
   UČITAVANJE
   ========================================================= */

async function loadTabContent() {

    const displayBox =
        document.getElementById('displayBox');

    const status =
        document.getElementById('status');

    displayBox.textContent =
        translations[currentLanguage].loading;

    status.textContent = '';

    currentText = '';

    const keys = getKeysToSearch();

    try {

        const { data, error } =
            await _supabase
                .from('citanja')
                .select('datum, tekst')
                .in('datum', keys);

        if (error) {
            console.error(error);

            displayBox.textContent =
                translations[currentLanguage].error;

            status.textContent =
                error.message;

            return;
        }

        let found = null;

        if (currentLanguage === 'en') {

            found = data.find(row =>
                row.datum === keys[0]
            );

            if (!found) {
                found = data.find(row =>
                    row.datum === keys[1]
                );
            }

        } else {

            found = data.find(row =>
                row.datum === keys[0]
            );

        }

        if (found && found.tekst) {

            currentText = found.tekst;

            displayBox.innerHTML =
                formatText(found.tekst);

        } else {

            displayBox.textContent =
                translations[currentLanguage].noText;

        }

    } catch (err) {

        console.error(err);

        displayBox.textContent =
            translations[currentLanguage].error;

        status.textContent =
            err.message || '';

    }

}


/* =========================================================
   FORMATIRANJE TEKSTA
   ========================================================= */

function formatText(text) {

    return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/__(.*?)__/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
}


function escapeHtml(text) {

    const div = document.createElement('div');

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   UREĐIVANJE
   ========================================================= */

function enableEdit() {

    const password =
        prompt(translations[currentLanguage].password);

    if (password !== MOJA_SIFRA) {

        if (password !== null) {

            alert(
                translations[currentLanguage].wrongPassword
            );

        }

        return;
    }

    document.getElementById('editor').value =
        currentText;

    document.getElementById('displayBox')
        .classList.add('hidden');

    document.getElementById('mainControls')
        .classList.add('hidden');

    document.getElementById('editArea')
        .classList.remove('hidden');

    document.querySelector('.toolbar').style.display =
        'flex';

}


/* =========================================================
   ČUVANJE
   ========================================================= */

async function saveTabContent() {

    const newText =
        document.getElementById('editor').value;

    const datePart =
        getDatePart();

    let prefix = '';

    if (currentTab === 'dnevno') {
        prefix = '';
    }

    if (currentTab === 'plan') {
        prefix = 'plan_';
    }

    if (currentTab === 'stih') {
        prefix = 'stih_';
    }

    if (currentTab === 'izreka') {
        prefix = 'izreka_';
    }

    if (currentTab === 'duhovno') {
        prefix = 'duhovno_';
    }

    let dbKey =
        prefix + datePart;

    if (currentLanguage === 'en') {
        dbKey = 'en_' + dbKey;
    }

    try {

        const { error } =
            await _supabase
                .from('citanja')
                .upsert(
                    {
                        datum: dbKey,
                        tekst: newText
                    },
                    {
                        onConflict: 'datum'
                    }
                );

        if (error) {

            console.error(error);

            alert(
                translations[currentLanguage].error +
                '\n\n' +
                error.message
            );

            return;
        }

        currentText = newText;

        document.getElementById('editor').value =
            newText;

        document.getElementById('editArea')
            .classList.add('hidden');

        document.getElementById('displayBox')
            .classList.remove('hidden');

        document.getElementById('mainControls')
            .classList.remove('hidden');

        document.querySelector('.toolbar').style.display =
            'none';

        document.getElementById('status').textContent =
            translations[currentLanguage].saved;

        loadTabContent();

    } catch (err) {

        console.error(err);

        alert(
            translations[currentLanguage].error +
            '\n\n' +
            (err.message || '')
        );

    }

}


/* =========================================================
   OTKAZIVANJE
   ========================================================= */

function cancelEdit() {

    document.getElementById('editArea')
        .classList.add('hidden');

    document.getElementById('displayBox')
        .classList.remove('hidden');

    document.getElementById('mainControls')
        .classList.remove('hidden');

    document.querySelector('.toolbar').style.display =
        'none';

}


/* =========================================================
   PROMENA DATUMA
   ========================================================= */

function changeDate() {

    currentDate =
        document.getElementById('datePicker').value;

    loadTabContent();

}


function changeDateBy(days) {

    const date =
        new Date(currentDate + 'T12:00:00');

    date.setDate(
        date.getDate() + days
    );

    currentDate =
        date.toISOString().split('T')[0];

    document.getElementById('datePicker').value =
        currentDate;

    loadTabContent();

}


function goToday() {

    currentDate =
        new Date().toISOString().split('T')[0];

    document.getElementById('datePicker').value =
        currentDate;

    loadTabContent();

}


/* =========================================================
   DELJENJE
   ========================================================= */

async function shareContent() {

    if (!currentText) {

        alert(
            translations[currentLanguage].noText
        );

        return;
    }

    const title =
        document.getElementById('appTitle').textContent;

    const shareData = {

        title: title,

        text: currentText

    };

    try {

        if (navigator.share) {

            await navigator.share(shareData);

        } else {

            await navigator.clipboard.writeText(
                currentText
            );

            alert(
                currentLanguage === 'sr'
                    ? 'Tekst je kopiran.'
                    : 'Text copied.'
            );

        }

    } catch (err) {

        console.log(err);

    }

}


/* =========================================================
   BOLD / ITALIC
   ========================================================= */

function makeBold() {

    insertFormatting('**');

}


function makeItalic() {

    insertFormatting('__');

}


function insertFormatting(mark) {

    const textarea =
        document.getElementById('editor');

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    const selected =
        textarea.value.substring(start, end);

    const replacement =
        mark + selected + mark;

    textarea.setRangeText(
        replacement,
        start,
        end,
        'select'
    );

    textarea.focus();

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function() {

        document.getElementById('datePicker').value =
            currentDate;

        applyTranslations();

        loadTabContent();

    }
);

</script>

</body>
</html>
