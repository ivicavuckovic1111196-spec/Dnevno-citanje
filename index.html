<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dnevno Čitanje</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    background: white;
    max-width: 700px;
    width: 100%;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.lang-switch {
    display: flex;
    gap: 5px;
}

.lang-btn {
    padding: 5px 10px;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid #3498db;
    background: white;
    color: #3498db;
    border-radius: 4px;
    cursor: pointer;
}

.lang-btn.active {
    background: #3498db;
    color: white;
}

.date-navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.date-navigation input {
    flex: 1;
}

.tab-navigation {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 20px;
}

.tab-btn {
    padding: 9px 4px;
    font-size: 11px;
    font-weight: bold;
    border: 2px solid #3498db;
    background: white;
    color: #3498db;
    border-radius: 8px;
    cursor: pointer;
}

.tab-btn.active {
    background-color: #3498db;
    color: white;
}

button,
input[type="date"] {
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    cursor: pointer;
}

.btn-main {
    background-color: #3498db;
    color: white;
    border: none;
}

.btn-purple {
    background-color: #9b59b6;
    color: white;
    border: none;
}

.toolbar {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}

.btn-bold {
    background-color: #27ae60;
    color: white;
    border: none;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 4px;
}

.btn-italic {
    background-color: #f39c12;
    color: white;
    border: none;
    font-style: italic;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 4px;
}

textarea {
    width: 100%;
    height: 250px;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    resize: vertical;
    line-height: 1.5;
}

.display-area {
    min-height: 250px;
    padding: 15px;
    border: 1px solid #eee;
    border-radius: 8px;
    background: #fafafa;
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.5;
}

.controls {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.hidden {
    display: none !important;
}

.status {
    font-size: 14px;
    color: #666;
    text-align: right;
    margin-top: 5px;
}

.footer {
    margin-top: 30px;
    padding-top: 15px;
    border-top: 1px solid #eee;
    text-align: center;
    font-size: 13px;
    color: #777;
}

.footer a {
    color: #3498db;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 500px) {

    .container {
        padding: 15px;
    }

    .tab-btn {
        font-size: 10px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- GORNJA TRAKA -->

<div class="top-bar">

    <div style="font-weight:bold;color:#555;" id="appTitle">
        Biblijsko Čitanje
    </div>

    <div class="lang-switch">

        <button
            id="langSrbBtn"
            class="lang-btn active"
            onclick="setLanguage('sr')">
            SRB
        </button>

        <button
            id="langEngBtn"
            class="lang-btn"
            onclick="setLanguage('en')">
            ENG
        </button>

    </div>

</div>


<!-- DATUM -->

<div class="date-navigation">

    <button
        class="btn-main"
        onclick="changeDate(-1)">
        ◀
    </button>

    <input
        type="date"
        id="datePicker"
        onchange="loadAllTabs()">

    <button
        class="btn-main"
        onclick="changeDate(1)">
        ▶
    </button>

</div>


<!-- 5 TABOVA -->

<div class="tab-navigation">

    <button
        id="tabDailyBtn"
        class="tab-btn active"
        onclick="switchTab('daily')">
        📖 Dnevno Čitanje
    </button>

    <button
        id="tabPlanBtn"
        class="tab-btn"
        onclick="switchTab('plan')">
        📜 Godišnji Plan
    </button>

    <button
        id="tabVerseBtn"
        class="tab-btn"
        onclick="switchTab('verse')">
        💎 Stih Ohrabrenja
    </button>

    <button
        id="tabQuoteBtn"
        class="tab-btn"
        onclick="switchTab('quote')">
        💡 Mudre Izreke
    </button>

    <button
        id="tabSpiritualBtn"
        class="tab-btn"
        onclick="switchTab('spiritual')">
        🕊️ Duhovna Razmatranja
    </button>

</div>


<!-- ================================= -->
<!-- DNEVNO ČITANJE -->
<!-- ================================= -->

<div id="dailySection">

    <div id="dailyViewMode">

        <div
            id="dailyDisplay"
            class="display-area">
            Učitavanje...
        </div>

        <div class="controls">

            <button
                id="dailyShareBtn"
                class="btn-purple"
                onclick="shareContent('dailyDisplay')">
                📦 Podeli
            </button>

            <button
                id="dailyEditBtn"
                class="btn-main"
                onclick="enableEdit('daily')">
                ⚙️ Uredi
            </button>

        </div>

    </div>


    <div id="dailyEditMode" class="hidden">

        <div class="toolbar">

            <button
                class="btn-bold"
                onclick="makeBold('dailyTextarea')">
                <b>B</b> Podebljano
            </button>

            <button
                class="btn-italic"
                onclick="makeItalic('dailyTextarea')">
                <i>I</i> Iskošeno
            </button>

        </div>

        <textarea
            id="dailyTextarea"
            placeholder="Unesite tekst..."></textarea>

        <div
            id="dailySaveStatus"
            class="status">
        </div>

        <div class="controls">

            <button onclick="cancelEdit('daily')">
                Otkaži
            </button>

            <button
                class="btn-main"
                onclick="saveTabContent('daily')">
                Sačuvaj
            </button>

        </div>

    </div>

</div>
