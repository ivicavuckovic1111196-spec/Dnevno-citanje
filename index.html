<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblijsko Čitanje</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      max-width: 700px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .lang-switch {
      display: flex;
      gap: 5px;
    }

    .lang-btn {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #3498db;
      background: white;
      color: #3498db;
      border-radius: 4px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #3498db;
      color: white;
    }

    .tab-navigation {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 5px;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }

    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    button,
    input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .btn-main {
      background-color: #3498db;
      color: white;
      border: none;
    }

    .btn-purple {
      background-color: #9b59b6;
      color: white;
      border: none;
    }

    .btn-red {
      background-color: #e74c3c;
      color: white;
      border: none;
    }

    .btn-green {
      background-color: #27ae60;
      color: white;
      border: none;
    }

    .toolbar {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }

    .btn-bold {
      background-color: #27ae60;
      color: white;
      border: none;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-italic {
      background-color: #f39c12;
      color: white;
      border: none;
      font-style: italic;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .display-area {
      min-height: 250px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
      box-sizing: border-box;
    }

    .display-area b,
    .display-area strong {
      font-weight: bold;
    }

    .display-area i,
    .display-area em {
      font-style: italic;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    .status {
      font-size: 14px;
      color: #666;
      text-align: right;
      margin-top: 5px;
    }

    .blog-card {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .blog-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .blog-date {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }

    .blog-text {
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .blog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .blog-editor {
      margin-top: 10px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    .blog-editor textarea {
      height: 300px;
    }

    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 13px;
      color: #777;
    }

    .footer a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      .tab-btn {
        font-size: 10px;
        padding: 8px 3px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- GORNJA TRAKA -->
  <div class="top-bar">
    <div style="font-weight:bold;color:#555;" id="appTitle">
      Biblijsko Čitanje
    </div>

    <div class="lang-switch">
      <button id="langSrbBtn"
              class="lang-btn active"
              onclick="setLanguage('sr')">
        SRB
      </button>

      <button id="langEngBtn"
              class="lang-btn"
              onclick="setLanguage('en')">
        ENG
      </button>
    </div>
  </div>


  <!-- DATUM -->
  <div id="dateNavigation" class="date-navigation">

    <button class="btn-main" onclick="changeDate(-1)">
      ◀
    </button>

    <input type="date"
           id="datePicker"
           onchange="loadAllTabs()">

    <button class="btn-main" onclick="changeDate(1)">
      ▶
    </button>

  </div>


  <!-- TABELA / TABOVI -->
  <div class="tab-navigation">

    <button id="tabDailyBtn"
            class="tab-btn active"
            onclick="switchTab('daily')">
      📖 Dnevno Čitanje
    </button>

    <button id="tabPlanBtn"
            class="tab-btn"
            onclick="switchTab('plan')">
      📜 Godišnji Plan
    </button>

    <button id="tabVerseBtn"
            class="tab-btn"
            onclick="switchTab('verse')">
      💎 Stih Ohrabrenja
    </button>

    <button id="tabQuoteBtn"
            class="tab-btn"
            onclick="switchTab('quote')">
      💡 Mudre Izreke
    </button>

    <button id="tabSpiritualBtn"
            class="tab-btn"
            onclick="switchTab('spiritual')">
      🕊️ Duhovna Razmatranja
    </button>

    <button id="tabBlogBtn"
            class="tab-btn"
            onclick="switchTab('blog')">
      📝 Blog
    </button>

  </div>


  <!-- ================================= -->
  <!-- 1. DNEVNO ČITANJE -->
  <!-- ================================= -->

  <div id="dailySection">

    <div id="dailyViewMode">

      <div id="dailyDisplay" class="display-area">
        Učitavanje...
      </div>

      <div class="controls">

        <button id="dailyShareBtn"
                class="btn-purple"
                onclick="shareContent(document.getElementById('dailyDisplay').innerText)">
          📦 Podeli
        </button>

        <button id="dailyEditBtn"
                class="btn-main"
                onclick="enableEdit('daily')">
          ⚙️ Uredi
        </button>

      </div>

    </div>


    <div id="dailyEditMode" class="hidden">

      <div class="toolbar">
        <button class="btn-bold"
                onclick="makeBold('dailyTextarea')">
          <b>B</b> Podebljano
        </button>

        <button class="btn-italic"
                onclick="makeItalic('dailyTextarea')">
          <i>I</i> Iskošeno
        </button>
      </div>

      <textarea id="dailyTextarea"
                placeholder="Unesite tekst..."></textarea>

      <div id="dailySaveStatus"
           class="status"></div>

      <div class="controls">

        <button onclick="cancelEdit('daily')">
          Otkaži
        </button>

        <button class="btn-main"
                onclick="saveTabContent('daily')">
          Sačuvaj
        </button>

      </div>

    </div>

  </div>


  <!-- ================================= -->
  <!-- 2. GODIŠNJI PLAN -->
  <!-- ================================= -->

  <div id="planSection" class="hidden">

    <div id="planViewMode">

      <div id="planDisplay" class="display-area">

      </div>

      <div class="controls">

        <button class="btn-purple"

          📦 Podeli
        </button>

        <button class="btn-main"

          ⚙️ Uredi
        </button>

      </div>

    </div>


    <div id="planEditMode" class="hidden">

  <!-- ================================= -->
  <!-- 4. MUDRE IZREKE -->

    <div id="quoteViewMode">

      <div id="quoteDisplay" class="display-area">

      </div>

      <div id="quoteSaveStatus"

      <div class="controls">

        <button onclick="cancelEdit('quote')">

        </button>

        <button class="btn-main"
                onclick="saveTabContent('quote')">

        </button>

      </div>

    </div>

  </div>


  <!-- ================================= -->
  <!-- 5. DUHOVNA RAZMATRANJA -->
  <!-- VEZANA SU ZA DATUM -->
  <!-- ================================= -->

  <div id="spiritualSection" class="hidden">

    <div id="spiritualViewMode">

      <div id="spiritualDisplay" class="display-area">
        Učitavanje...
      </div>

      <div class="controls">

        <button class="btn-purple"
                onclick="shareContent(document.getElementById('spiritualDisplay').innerText)">
          📦 Podeli
        </button>

        <button class="btn-main"
                onclick="enableEdit('spiritual')">
          ⚙️ Uredi
        </button>

      </div>

    </div>


    <div id="spiritualEditMode" class="hidden">

      <div class="toolbar">

        <button class="btn-bold"
                onclick="makeBold('spiritualTextarea')">
          <b>B</b> Podebljano
        </button>

        <button class="btn-italic"
                onclick="makeItalic('spiritualTextarea')">
          <i>I</i> Iskošeno
        </button>

      </div>

      <textarea id="spiritualTextarea"
                placeholder="Unesite duhovno razmatranje..."></textarea>

      <div id="spiritualSaveStatus"
           class="status"></div>

      <div class="controls">

        <button onclick="cancelEdit('spiritual')">
          Otkaži
        </button>

        <button class="btn-main"
                onclick="saveTabContent('spiritual')">
          Sačuvaj
        </button>

      </div>

    </div>

  </div>


  <!-- ================================= -->
  <!-- 6. BLOG -->
  <!-- NIJE VEZAN ZA DATUM -->
  <!-- NAJNOVIJI JE PRVI -->
  <!-- ================================= -->

  <div id="blogSection" class="hidden">

    <div class="controls"
         style="justify-content:flex-start;margin-bottom:15px;">

      <button class="btn-green"
              onclick="enableNewBlog()">
        ➕ Novi blog
      </button>

    </div>


    <!-- NOVI BLOG -->
    <div id="blogEditor"
         class="blog-editor hidden">

      <input type="hidden"
             id="blogEditId">

      <input type="text"
             id="blogTitleInput"
             placeholder="Naslov bloga">

      <div class="toolbar">

        <button class="btn-bold"
                onclick="makeBold('blogTextInput')">
          <b>B</b> Podebljano
        </button>

        <button class="btn-italic"
                onclick="makeItalic('blogTextInput')">
          <i>I</i> Iskošeno
        </button>

      </div>

      <textarea id="blogTextInput"
                placeholder="Tekst bloga..."></textarea>

      <div id="blogSaveStatus"
           class="status"></div>

      <div class="controls">

        <button onclick="cancelBlogEdit()">
          Otkaži
        </button>

        <button class="btn-main"
                onclick="saveBlog()">
          Sačuvaj blog
        </button>

      </div>

    </div>


    <!-- BLOGOVI -->
    <div id="blogList">
      Učitavanje...
    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <span id="authorText">
      Autor: Ivica Vučković
    </span>

    |

    <span id="contactText">
      Kontakt:
    </span>

    <a href="mailto:slugaisusahristosa@gmail.com">
      slugaisusahristosa@gmail.com
    </a>

  </div>

</div>
