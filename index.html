<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnevno Čitanje</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }
    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    button, input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .btn-main {
      background-color: #3498db;
      color: white;
      border: none;
    }
    .btn-purple {
      background-color: #9b59b6;
      color: white;
      border: none;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }
    .display-area {
      min-height: 250px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .hidden {
      display: none;
    }
    .status {
      font-size: 14px;
      color: #666;
      text-align: right;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 Dnevno Čitanje</h1>

    <div class="date-navigation">
      <button class="btn-main" onclick="changeDate(-1)">◀</button>
      <input type="date" id="datePicker" onchange="loadContent()">
      <button class="btn-main" onclick="changeDate(1)">▶</button>
    </div>

    <div id="viewMode">
      <div id="contentDisplay" class="display-area">Učitavanje...</div>
      <div class="controls">
        <button class="btn-purple" onclick="shareContent()">📦 Podeli</button>
        <button class="btn-main" onclick="enableEdit()">⚙️ Uredi</button>
      </div>
    </div>

    <div id="editMode" class="hidden">
      <textarea id="contentTextarea" placeholder="Unesite tekst za izabrani datum..."></textarea>
      <div id="saveStatus" class="status"></div>
      <div class="controls">
        <button onclick="cancelEdit()">Otkaži</button>
        <button class="btn-main" onclick="saveContent()">Sačuvaj</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tkwxklzhjvccgszxkxsy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oDohLHeSQV3xT2Kz-1ZA8A_jyMHj_8D';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // POSTAVI SVOJU ŠIFRU OVDE za uređivanje (zameni 1234 svojom šifrom)
    const MOJA_SIFRA = '1234';

    const datePicker = document.getElementById('datePicker');
    const contentDisplay = document.getElementById('contentDisplay');
    const contentTextarea = document.getElementById('contentTextarea');
    const viewMode = document.getElementById('viewMode');
    const editMode = document.getElementById('editMode');
    const saveStatus = document.getElementById('saveStatus');

    const today = new Date().toISOString().split('T')[0];
    datePicker.value = today;

    async function loadContent() {
      const selectedDate = datePicker.value;
      contentDisplay.textContent = "Učitavanje...";

      const { data, error } = await _supabase
        .from('citanja')
        .select('tekst')
        .eq('datum', selectedDate)
        .single();

      if (error && error.code !== 'PGRST116') {
        console.error("Greška pri preuzimanju:", error);
      }

      if (data && data.tekst) {
        contentDisplay.textContent = data.tekst;
      } else {
        contentDisplay.textContent = "Nema unetog teksta za ovaj datum.";
      }
    }

    function enableEdit() {
      const unetaSifra = prompt("Unesite šifru za uređivanje:");
      if (unetaSifra !== MOJA_SIFRA) {
        alert("Pogrešna šifra! Samo administrator može uređivati tekst.");
        return;
      }

      const currentText = contentDisplay.textContent.includes("Nema unetog teksta") ? "" : contentDisplay.textContent;
      contentTextarea.value = currentText;
      viewMode.classList.add('hidden');
      editMode.classList.remove('hidden');
    }

    async function saveContent() {
      const selectedDate = datePicker.value;
      const newText = contentTextarea.value;
      saveStatus.textContent = "Čuvanje...";

      const { error } = await _supabase
        .from('citanja')
        .upsert({ datum: selectedDate, tekst: newText }, { onConflict: 'datum' });

      if (error) {
        alert("Greška pri čuvanju: " + error.message);
        saveStatus.textContent = "";
      } else {
        saveStatus.textContent = "";
        contentDisplay.textContent = newText || "Nema unetog teksta za ovaj datum.";
        editMode.classList.add('hidden');
        viewMode.classList.remove('hidden');
      }
    }

    function changeDate(days) {
      const currentDate = new Date(datePicker.value);
      currentDate.setDate(currentDate.getDate() + days);
      datePicker.value = currentDate.toISOString().split('T')[0];
      loadContent();
    }

    function cancelEdit() {
      editMode.classList.add('hidden');
      viewMode.classList.remove('hidden');
    }

    function shareContent() {
      if (navigator.share) {
        navigator.share({
          title: 'Dnevno Čitanje',
          text: contentDisplay.textContent,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(contentDisplay.textContent);
        alert("Tekst je kopiran u međuspremnik!");
      }
    }

    loadContent();
  </script>
</body>
</html>
