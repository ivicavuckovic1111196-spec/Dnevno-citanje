<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblijsko Čitanje</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.app-title {
    font-weight: bold;
    color: #555;
}

.lang-switch {
    display: flex;
    gap: 5px;
}

.lang-btn {
    padding: 5px 9px;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid #3498db;
    background: white;
    color: #3498db;
    border-radius: 5px;
    cursor: pointer;
}

.lang-btn.active {
    background: #3498db;
    color: white;
}

.date-navigation {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.date-navigation input {
    flex: 1;
    text-align: center;
}

button,
input[type="date"],
input[type="text"] {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
}

button {
    cursor: pointer;
}

.btn-main {
    background: #3498db;
    color: white;
    border: none;
}

.btn-purple {
    background: #9b59b6;
    color: white;
    border: none;
}

.btn-green {
    background: #27ae60;
    color: white;
    border: none;
}

.btn-red {
    background: #e74c3c;
    color: white;
    border: none;
}

.tab-navigation {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 20px;
}

.tab-btn {
    padding: 10px 4px;
    font-size: 11px;
    font-weight: bold;
    border: 2px solid #3498db;
    background: white;
    color: #3498db;
    border-radius: 7px;
}

.tab-btn.active {
    background: #3498db;
    color: white;
}

.display-area {
    min-height: 220px;
    padding: 15px;
    border: 1px solid #eee;
    border-radius: 8px;
    background: #fafafa;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 16px;
}

.controls {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.toolbar {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}

.btn-bold {
    background: #27ae60;
    color: white;
    border: none;
    font-weight: bold;
}

.btn-italic {
    background: #f39c12;
    color: white;
    border: none;
    font-style: italic;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 250px;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    line-height: 1.5;
    resize: vertical;
}

input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
}

.hidden {
    display: none !important;
}

.status {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
    text-align: right;
}

.blog-card {
    background: #fafafa;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

.blog-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 6px;
}

.blog-date {
    color: #888;
    font-size: 12px;
    margin-bottom: 12px;
}

.blog-content {
    font-size: 16px;
    line-height: 1.6;
}

.blog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.blog-editor {
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.footer {
    border-top: 1px solid #eee;
    margin-top: 30px;
    padding-top: 15px;
    text-align: center;
    color: #777;
    font-size: 13px;
}

.footer a {
    color: #3498db;
    text-decoration: none;
}

@media (max-width: 500px) {

    .container {
        padding: 12px;
    }

    .tab-btn {
        font-size: 10px;
    }

}

</style>
</head>


<body>

<div class="container">

    <!-- GORNJA TRAKA -->

    <div class="top-bar">

        <div class="app-title" id="appTitle">
            Biblijsko Čitanje
        </div>

        <div class="lang-switch">

            <button
                id="langSrbBtn"
                class="lang-btn active"
                onclick="setLanguage('sr')">
                SRB
            </button>

            <button
                id="langEngBtn"
                class="lang-btn"
                onclick="setLanguage('en')">
                ENG
            </button>

        </div>

    </div>


    <!-- DATUM -->

    <div id="dateNavigation" class="date-navigation">

        <button
            class="btn-main"
            onclick="changeDate(-1)">
            ◀
        </button>

        <input
            type="date"
            id="datePicker"
            onchange="loadAllDateTabs()">

        <button
            class="btn-main"
            onclick="changeDate(1)">
            ▶
        </button>

    </div>


    <!-- TABOVI -->

    <div class="tab-navigation">

        <button
            id="tabDailyBtn"
            class="tab-btn active"
            onclick="switchTab('daily')">
            📖 Dnevno Čitanje
        </button>

        <button
            id="tabPlanBtn"
            class="tab-btn"
            onclick="switchTab('plan')">
            📜 Godišnji Plan
        </button>

        <button
            id="tabVerseBtn"
            class="tab-btn"
            onclick="switchTab('verse')">
            💎 Stih Ohrabrenja
        </button>

        <button
            id="tabQuoteBtn"
            class="tab-btn"
            onclick="switchTab('quote')">
            💡 Mudre Izreke
        </button>

        <button
            id="tabSpiritualBtn"
            class="tab-btn"
            onclick="switchTab('spiritual')">
            🕊️ Duhovna Razmatranja
        </button>

        <button
            id="tabBlogBtn"
            class="tab-btn"
            onclick="switchTab('blog')">
            📝 Blog
        </button>

    </div>


    <!-- ================================= -->
    <!-- DNEVNO ČITANJE -->
    <!-- ================================= -->

    <section id="dailySection">

        <div id="dailyViewMode">

            <div id="dailyDisplay" class="display-area">
                Učitavanje...
            </div>

            <div class="controls">

                <button
                    class="btn-purple"
                    onclick="shareElement('dailyDisplay')">
                    📦 Podeli
                </button>

                <button
                    class="btn-main"
                    onclick="enableEdit('daily')">
                    ⚙️ Uredi
                </button>

            </div>

        </div>


        <div id="dailyEditMode" class="hidden">

            <div class="toolbar">

                <button
                    class="btn-bold"
                    onclick="makeBold('dailyTextarea')">
                    <b>B</b> Podebljano
                </button>

                <button
                    class="btn-italic"
                    onclick="makeItalic('dailyTextarea')">
                    <i>I</i> Iskošeno
                </button>

            </div>

            <textarea
                id="dailyTextarea"
                placeholder="Unesite tekst...">
            </textarea>

            <div
                id="dailySaveStatus"
                class="status">
            </div>

            <div class="controls">

                <button onclick="cancelEdit('daily')">
                    Otkaži
                </button>

                <button
                    class="btn-main"
                    onclick="saveTabContent('daily')">
                    Sačuvaj
                </button>

            </div>

        </div>

    </section>


    <!-- ================================= -->
    <!-- GODIŠNJI PLAN -->
    <!-- ================================= -->

    <section id="planSection" class="hidden">

        <div id="planViewMode">

            <div id="planDisplay" class="display-area">
                Učitavanje...
            </div>

            <div class="controls">

                <button
                    class="btn-purple"
                    onclick="shareElement('planDisplay')">
                    📦 Podeli
                </button>

                <button
                    class="btn-main"
                    onclick="enableEdit('plan')">
                    ⚙️ Uredi
                </button>

            </div>

        </div>


        <div id="planEditMode" class="hidden">

            <div class="toolbar">

                <button
                    class="btn-bold"
                    onclick="makeBold('planTextarea')">
                    <b>B</b> Podebljano
                </button>

                <button
                    class="btn-italic"
                    onclick="makeItalic('planTextarea')">
                    <i>I</i> Iskošeno
                </button>

            </div>

            <textarea
                id="planTextarea"
                placeholder="Unesite tekst...">
            </textarea>

            <div id="planSaveStatus" class="status"></div>

            <div class="controls">

                <button onclick="cancelEdit('plan')">
                    Otkaži
                </button>

                <button
                    class="btn-main"
                    onclick="saveTabContent('plan')">
                    Sačuvaj
                </button>

            </div>

        </div>

    </section>
