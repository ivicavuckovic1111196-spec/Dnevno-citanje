<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dnevno Čitanje & Blog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1ea;
    color: #333;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    min-height: 100vh;
    padding: 15px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: 25px;
    color: #4b3621;
}

.lang {
    display: flex;
    gap: 5px;
}

.lang button {
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.lang button.active {
    background: #4b3621;
    color: white;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 15px;
}

.tab {
    flex: 1 1 130px;
    padding: 11px 8px;
    border: none;
    border-radius: 7px;
    background: #e6e0d5;
    cursor: pointer;
    font-size: 14px;
}

.tab.active {
    background: #6b4f2a;
    color: white;
}

.date-area {
    text-align: center;
    margin-bottom: 15px;
}

.date-area input {
    padding: 9px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

.date-buttons {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.date-buttons button {
    padding: 8px 15px;
    border: none;
    border-radius: 6px;
    background: #6b4f2a;
    color: white;
    cursor: pointer;
}

.content-box {
    background: #faf8f3;
    border: 1px solid #ddd4c6;
    border-radius: 10px;
    padding: 20px;
    min-height: 300px;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 17px;
}

.toolbar {
    display: none;
    gap: 5px;
    margin-bottom: 8px;
}

.toolbar button {
    padding: 7px 12px;
    border: 1px solid #bbb;
    background: white;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 250px;
    padding: 15px;
    font-size: 17px;
    line-height: 1.6;
    border: 1px solid #bbb;
    border-radius: 8px;
    resize: vertical;
}

.controls {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.controls button, .external-btn {
    padding: 9px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.edit { background: #6b4f2a; color: white; }
.share { background: #4b7f52; color: white; }
.save { background: #287a45; color: white; }
.cancel { background: #999; color: white; }
.delete-btn { background: #a93226; color: white; }

.blog-link-card {
    background: #e8f0fe;
    border: 1px solid #b6d4fe;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
    text-align: center;
}

.blog-link-card h3 {
    margin-top: 0;
    color: #1a0dab;
}

.external-btn {
    background: #1a73e8;
    color: white;
    font-weight: bold;
    margin-top: 10px;
}

.blog-item {
    background: #faf8f3;
    border: 1px solid #ddd4c6;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
}

.blog-item h3 {
    margin-top: 0;
    color: #4b3621;
}

.blog-date {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
}

.status {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #777;
}

footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 15px;
    border-top: 1px solid #eee;
    color: #777;
    font-size: 13px;
}

footer a {
    color: #6b4f2a;
    text-decoration: none;
    font-weight: bold;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <h1 id="appTitle">📖 Dnevno Čitanje</h1>

        <div class="lang">
            <button id="srBtn" class="active" onclick="setLanguage('sr')">SR</button>
            <button id="enBtn" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-dnevno" onclick="switchTab('dnevno')">📖 Dnevno Čitanje</button>
        <button class="tab" id="tab-plan" onclick="switchTab('plan')">📜 Godišnji Plan</button>
        <button class="tab" id="tab-stih" onclick="switchTab('stih')">💎 Stih Ohrabrenja</button>
        <button class="tab" id="tab-izreka" onclick="switchTab('izreka')">💡 Mudre Izreke</button>
        <button class="tab" id="tab-duhovno" onclick="switchTab('duhovno')">🕊️ Duhovna Razmatranja</button>
        <button class="tab" id="tab-blog" onclick="switchTab('blog')">✍️ Blog</button>
    </div>

    <div class="date-area" id="dateSection">
        <input type="date" id="datePicker" onchange="changeDate()">

        <div class="date-buttons">
            <button onclick="changeDateBy(-1)">◀</button>

    <!-- STANDARDNI PRIKAZ ZA SVE TABOVE OSIM BLOGA -->
    <div id="displayBox" class="content-box">
        Učitavanje...
    </div>

    <!-- PRIKAZ BLOGA -->
    <div id="blogContainer" class="hidden">
        
        <!-- LINK KA EKSTERNOM BLOGU -->
        <div class="blog-link-card">
            <h3 id="externalBlogTitle">🔗 Posetite naš zvanični Blog</h3>
            <p id="externalBlogDesc">Za više autorskih tekstova i članaka možete posetiti naš eksterni blog.</p>
            <a href="https://put-ka-bogu.blogspot.com/?m=1" target="_blank" class="external-btn" id="externalBlogBtn">🌐 Otvori Blog (put-ka-bogu.blogspot.com) ↗</a>
        </div>

        <div id="blogList"></div>
    </div>

    <!-- EKRAN ZA UREĐIVANJE -->
    <div id="editArea" class="hidden">

        <div class="toolbar">
            <button onclick="makeBold()">B</button>
            <button onclick="makeItalic()"><i>I</i></button>
        </div>

        <div id="blogTitleArea" class="hidden">
            <input type="text" id="blogTitleInput" placeholder="Naslov bloga...">
        </div>

        <textarea id="editor"></textarea>

        <div class="controls">
            <button class="save" onclick="saveContent()" id="saveBtn">Sačuvaj</button>
            <button class="cancel" onclick="cancelEdit()" id="cancelBtn">Otkaži</button>
        </div>

    </div>

    <div class="controls" id="mainControls">
        <button class="share" onclick="shareContent()" id="shareBtn">📤 Podeli</button>
        <button class="edit" onclick="enableEdit()" id="editBtn">✏️ Uredi</button>
    </div>

    <div id="status" class="status"></div>

    <footer>
        <span id="authorText">Autor: Ivica Vučković</span> | 
        <span id="contactText">Kontakt:</span> <a href="mailto:slugaisusahristosa@gmail.com">slugaisusahristosa@gmail.com</a>
    </footer>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL = 'https://tkwxklzhjvccgszxkxsy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XJ1E7HAtQNXSYCMtCeCk6A_78hqKMEo';

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================================================
   PODEŠAVANJA
   ========================================================= */

const MOJA_SIFRA = '1234';
let currentTab = 'dnevno';
let currentLanguage = 'sr';
let currentDate = new Date().toISOString().split('T')[0];
let currentText = '';
let editingBlogId = null;
let blogDataCache = [];


/* =========================================================
   PREVODI
   ========================================================= */

const translations = {
    sr: {
        title: '📖 Dnevno Čitanje',
        dnevno: '📖 Dnevno Čitanje',
        plan: '📜 Godišnji Plan',
        stih: '💎 Stih Ohrabrenja',
        izreka: '💡 Mudre Izreke',
        duhovno: '🕊️ Duhovna Razmatranja',
        blog: '✍️ Blog',
        today: 'Danas',
        share: '📤 Podeli',
        edit: '✏️ Uredi',
        addBlog: '➕ Novi Blog',
        save: 'Sačuvaj',
        cancel: 'Otkaži',
        loading: 'Učitavanje...',
        noText: 'Za ovaj datum još nema unetog teksta.',
        noBlog: 'Trenutno nema objavljenih lokalnih blogova.',
        extTitle: '🔗 Posetite naš zvanični Blog',
        extDesc: 'Za više autorskih tekstova i članaka posetite naš blog na Blogger platformi.',
        extBtn: '🌐 Otvori Blog (put-ka-bogu.blogspot.com) ↗',
        saved: 'Sadržaj je uspešno sačuvan.',
        password: 'Unesite šifru:',
        wrongPassword: 'Pogrešna šifra.',
        error: 'Došlo je do greške.',
        author: 'Autor: Ivica Vučković',
        contact: 'Kontakt:'
    },
    en: {
        title: '📖 Daily Reading',
        dnevno: '📖 Daily Reading',
        plan: '📜 Annual Plan',
        stih: '💎 Verse of Encouragement',
        izreka: '💡 Wise Sayings',
        duhovno: '🕊️ Spiritual Reflections',
        blog: '✍️ Blog',
        today: 'Today',
        share: '📤 Share',
        edit: '✏️ Edit',
        addBlog: '➕ New Blog',
        save: 'Save',
        cancel: 'Cancel',
        loading: 'Loading...',
        noText: 'There is no text entered for this date yet.',
        noBlog: 'There are no local blog posts published yet.',
        extTitle: '🔗 Visit our official Blog',
        extDesc: 'For more articles and posts, visit our external Blogger page.',
        extBtn: '🌐 Open Blog (put-ka-bogu.blogspot.com) ↗',
        saved: 'Content successfully saved.',
        password: 'Enter password:',
        wrongPassword: 'Wrong password.',
        error: 'An error occurred.',
        author: 'Author: Ivica Vučković',
        contact: 'Contact:'
    }
};


/* =========================================================
   PRIMENA PREVODA
   ========================================================= */

function applyTranslations() {
    const t = translations[currentLanguage];

    document.getElementById('appTitle').textContent = t.title;
    document.getElementById('tab-dnevno').textContent = t.dnevno;
    document.getElementById('tab-plan').textContent = t.plan;
    document.getElementById('tab-stih').textContent = t.stih;
    document.getElementById('tab-izreka').textContent = t.izreka;
    document.getElementById('tab-duhovno').textContent = t.duhovno;
    document.getElementById('tab-blog').textContent = t.blog;

    document.getElementById('todayBtn').textContent = t.today;
    document.getElementById('shareBtn').textContent = t.share;
    document.getElementById('editBtn').textContent = (currentTab === 'blog') ? t.addBlog : t.edit;
    document.getElementById('saveBtn').textContent = t.save;
    document.getElementById('cancelBtn').textContent = t.cancel;
    document.getElementById('authorText').textContent = t.author;
    document.getElementById('contactText').textContent = t.contact;

    document.getElementById('externalBlogTitle').textContent = t.extTitle;
    document.getElementById('externalBlogDesc').textContent = t.extDesc;
    document.getElementById('externalBlogBtn').textContent = t.extBtn;
}


/* =========================================================
   JEZIK
   ========================================================= */

function setLanguage(lang) {
    currentLanguage = lang;
    document.getElementById('srBtn').classList.toggle('active', lang === 'sr');
    document.getElementById('enBtn').classList.toggle('active', lang === 'en');
    applyTranslations();
    loadTabContent();
}


/* =========================================================
   TABOVI
   ========================================================= */

function switchTab(tab) {
    currentTab = tab;
    editingBlogId = null;

    document.querySelectorAll('.tab').forEach(button => button.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    document.getElementById('editArea').classList.add('hidden');
    document.getElementById('mainControls').classList.remove('hidden');

    const isBlog = (tab === 'blog');
    document.getElementById('dateSection').classList.toggle('hidden', isBlog);
    document.getElementById('displayBox').classList.toggle('hidden', isBlog);
    document.getElementById('blogContainer').classList.toggle('hidden', !isBlog);
    document.getElementById('shareBtn').classList.toggle('hidden', isBlog);

    applyTranslations();
    loadTabContent();
}


/* =========================================================
   DATUM
   ========================================================= */

function getDatePart() {
    const parts = currentDate.split('-');
    return parts[1] + '-' + parts[2];
}

function getKeysToSearch() {
    const datePart = getDatePart();
    let prefix = '';

    if (currentTab === 'plan') prefix = 'plan_';
    if (currentTab === 'stih') prefix = 'stih_';
    if (currentTab === 'izreka') prefix = 'izreka_';
    if (currentTab === 'duhovno') prefix = 'duhovno_';

    const key = prefix + datePart;
    const englishKey = 'en_' + prefix + datePart;

    return (currentLanguage === 'en') ? [englishKey, key] : [key];
}


/* =========================================================
   UČITAVANJE
   ========================================================= */

async function loadTabContent() {
    document.getElementById('status').textContent = '';

    if (currentTab === 'blog') {
        await loadBlogs();
    } else {
        await loadStandardReading();
    }
}

async function loadStandardReading() {
    const displayBox = document.getElementById('displayBox');
    displayBox.textContent = translations[currentLanguage].loading;
    currentText = '';

    const keys = getKeysToSearch();

    try {
        const { data, error } = await _supabase
            .from('citanja')
            .select('datum, tekst')
            .in('datum', keys);

        if (error) throw error;

        let found = data.find(row => row.datum === keys[0]) || (currentLanguage === 'en' ? data.find(row => row.datum === keys[1]) : null);

        if (found && found.tekst) {
            currentText = found.tekst;
            displayBox.innerHTML = formatText(found.tekst);
        } else {
            displayBox.textContent = translations[currentLanguage].noText;
        }
    } catch (err) {
        console.error(err);
        displayBox.textContent = translations[currentLanguage].error;
    }
}

async function loadBlogs() {
    const blogList = document.getElementById('blogList');
    blogList.innerHTML = `<p style="text-align:center;">${translations[currentLanguage].loading}</p>`;

    try {
        const { data, error } = await _supabase
            .from('blog')
            .select('*')
            .order('datum_objave', { ascending: false });

        if (error) throw error;

        blogDataCache = data || [];

        if (!data || data.length === 0) {
            blogList.innerHTML = `<p style="text-align:center;">${translations[currentLanguage].noBlog}</p>`;
            return;
        }

        renderBlogList();

    } catch (err) {
        console.error("Greska pri ucitavanju bloga:", err);
        // Ako tabela blog jos ne postoji u bazi, prikazujemo samo obavestenje
        blogList.innerHTML = `<p style="text-align:center;">${translations[currentLanguage].noBlog}</p>`;
    }
}

function renderBlogList() {
    const blogList = document.getElementById('blogList');
    blogList.innerHTML = '';

    blogDataCache.forEach((item, index) => {
        const dateStr = item.datum_objave ? new Date(item.datum_objave).toLocaleString() : '';
        const div = document.createElement('div');
        div.className = 'blog-item';

        const h3 = document.createElement('h3');
        h3.textContent = item.naslov;

        const dateDiv = document.createElement('div');
        dateDiv.className = 'blog-date';
        dateDiv.textContent = dateStr ? '📅 ' + dateStr : '';

        const textDiv = document.createElement('div');
        textDiv.innerHTML = formatText(item.tekst);

        const ctrlDiv = document.createElement('div');
        ctrlDiv.className = 'controls';
        ctrlDiv.style.marginTop = '10px';

        const shareBtn = document.createElement('button');
        shareBtn.className = 'share';
        shareBtn.textContent = '📤 Podeli';
        shareBtn.onclick = () => shareCustomText(item.naslov, item.tekst);

        const editBtn = document.createElement('button');
        editBtn.className = 'edit';
        editBtn.textContent = '✏️ Izmeni';
        editBtn.onclick = () => editBlogItemByIndex(index);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '🗑️ Obriši';
        delBtn.onclick = () => deleteBlogItem(item.id);

        ctrlDiv.appendChild(shareBtn);
        ctrlDiv.appendChild(editBtn);
        ctrlDiv.appendChild(delBtn);

        div.appendChild(h3);
        if (dateStr) div.appendChild(dateDiv);
        div.appendChild(textDiv);
        div.appendChild(ctrlDiv);

        blogList.appendChild(div);
    });
}


/* =========================================================
   FORMATIRANJE TEKSTA
   ========================================================= */

function formatText(text) {
    if (!text) return '';
    return text
        .replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/__(.*?)__/g, '<i>$1</i>')
        .replace(/\n/g, '<br>');
}


/* =========================================================
   UREĐIVANJE & ČUVANJE
   ========================================================= */

function enableEdit() {
    const password = prompt(translations[currentLanguage].password);
    if (password !== MOJA_SIFRA) {
        if (password !== null) alert(translations[currentLanguage].wrongPassword);
        return;
    }

    editingBlogId = null;
    document.getElementById('blogTitleInput').value = '';
    document.getElementById('editor').value = currentText;

    showEditor(currentTab === 'blog');
}

function editBlogItemByIndex(index) {
    const item = blogDataCache[index];
    if (!item) return;

    const password = prompt(translations[currentLanguage].password);
    if (password !== MOJA_SIFRA) {
        if (password !== null) alert(translations[currentLanguage].wrongPassword);
        return;
    }

    editingBlogId = item.id;
    document.getElementById('blogTitleInput').value = item.naslov;
    document.getElementById('editor').value = item.tekst;

    showEditor(true);
}

function showEditor(isBlog) {
    document.getElementById('displayBox').classList.add('hidden');
    document.getElementById('blogContainer').classList.add('hidden');
    document.getElementById('mainControls').classList.add('hidden');

    document.getElementById('blogTitleArea').classList.toggle('hidden', !isBlog);
    document.getElementById('editArea').classList.remove('hidden');
    document.querySelector('.toolbar').style.display = 'flex';
}

async function saveContent() {
    if (currentTab === 'blog') {
        await saveBlog();
    } else {
        await saveStandardReading();
    }
}

async function saveStandardReading() {
    const newText = document.getElementById('editor').value;
    const datePart = getDatePart();
    let prefix = '';

    if (currentTab === 'plan') prefix = 'plan_';
    if (currentTab === 'stih') prefix = 'stih_';
    if (currentTab === 'izreka') prefix = 'izreka_';
    if (currentTab === 'duhovno') prefix = 'duhovno_';

    let dbKey = prefix + datePart;
    if (currentLanguage === 'en') dbKey = 'en_' + dbKey;

    try {
        const { error } = await _supabase
            .fro
