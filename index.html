<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnevno Čitanje & Plan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .lang-switch {
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #3498db;
      background: white;
      color: #3498db;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #3498db;
      color: white;
    }
    .tab-navigation {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 4px;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }
    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    button, input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .btn-main {
      background-color: #3498db;
      color: white;
      border: none;
    }
    .btn-purple {
      background-color: #9b59b6;
      color: white;
      border: none;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }
    .display-area {
      min-height: 250px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .hidden {
      display: none;
    }
    .status {
      font-size: 14px;
      color: #666;
      text-align: right;
      margin-top: 5px;
    }
    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
    .footer a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div style="font-weight: bold; color: #555;" id="appTitle">Biblijsko Čitanje</div>
      <div class="lang-switch">
        <button id="langSrbBtn" class="lang-btn active" onclick="setLanguage('sr')">SRB</button>
        <button id="langEngBtn" class="lang-btn" onclick="setLanguage('en')">ENG</button>
      </div>
    </div>

    <!-- Izbor datuma -->
    <div class="date-navigation">
      <button class="btn-main" onclick="changeDate(-1)">◀</button>
      <input type="date" id="datePicker" onchange="loadAllTabs()">
      <button class="btn-main" onclick="changeDate(1)">▶</button>
    </div>

    <!-- Navigacija između 4 taba -->
    <div class="tab-navigation">
      <button id="tabDailyBtn" class="tab-btn active" onclick="switchTab('daily')">📖 Dnevno Čitanje</button>
      <button id="tabPlanBtn" class="tab-btn" onclick="switchTab('plan')">📜 Godišnji Plan</button>
      <button id="tabVerseBtn" class="tab-btn" onclick="switchTab('verse')">💎 Stih Ohrabrenja</button>
      <button id="tabQuoteBtn" class="tab-btn" onclick="switchTab('quote')">💡 Mudre Izreke</button>
    </div>

    <!-- TAB 1: Dnevno čitanje -->
    <div id="dailySection">
      <div id="dailyViewMode">
        <div id="dailyDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="dailyShareBtn" class="btn-purple" onclick="shareContent(dailyDisplay.textContent)">📦 Podeli</button>
          <button id="dailyEditBtn" class="btn-main" onclick="enableEdit('daily')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="dailyEditMode" class="hidden">
        <textarea id="dailyTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="dailySaveStatus" class="status"></div>
        <div class="controls">
          <button id="dailyCancelBtn" onclick="cancelEdit('daily')">Otkaži</button>
          <button id="dailySaveBtn" class="btn-main" onclick="saveTabContent('daily')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: Godišnji plan čitanja -->
    <div id="planSection" class="hidden">
      <div id="planViewMode">
        <div id="planDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="planShareBtn" class="btn-purple" onclick="shareContent(planDisplay.textContent)">📦 Podeli</button>
          <button id="planEditBtn" class="btn-main" onclick="enableEdit('plan')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="planEditMode" class="hidden">
        <textarea id="planTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="planSaveStatus" class="status"></div>
        <div class="controls">
          <button id="planCancelBtn" onclick="cancelEdit('plan')">Otkaži</button>
          <button id="planSaveBtn" class="btn-main" onclick="saveTabContent('plan')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: Stih ohrabrenja -->
    <div id="verseSection" class="hidden">
      <div id="verseViewMode">
        <div id="verseDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="verseShareBtn" class="btn-purple" onclick="shareContent(verseDisplay.textContent)">📦 Podeli</button>
          <button id="verseEditBtn" class="btn-main" onclick="enableEdit('verse')">⚙️ Uredi</button>
        </div>
      </div>

        <textarea id="verseTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="verseSaveStatus" class="status"></div>
