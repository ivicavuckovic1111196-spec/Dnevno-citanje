<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnevno Čitanje & Plan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .lang-switch {
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #3498db;
      background: white;
      color: #3498db;
      border-radius: 4px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #3498db;
      color: white;
    }
    .tab-navigation {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 4px;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }
    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    button, input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .btn-main {
      background-color: #3498db;
      color: white;
      border: none;
    }
    .btn-purple {
      background-color: #9b59b6;
      color: white;
      border: none;
    }
    .toolbar {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }
    .btn-bold {
      background-color: #27ae60;
      color: white;
      border: none;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-italic {
      background-color: #f39c12;
      color: white;
      border: none;
      font-style: italic;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }
    .display-area {
      min-height: 250px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
    }
    .display-area b, .display-area strong {
      font-weight: bold;
    }
    .display-area i, .display-area em {
      font-style: italic;
    }
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .hidden {
      display: none;
    }
    .status {
      font-size: 14px;
      color: #666;
      text-align: right;
      margin-top: 5px;
    }
    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
    .footer a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div style="font-weight: bold; color: #555;" id="appTitle">Biblijsko Čitanje</div>
      <div class="lang-switch">
        <button id="langSrbBtn" class="lang-btn active" onclick="setLanguage('sr')">SRB</button>
        <button id="langEngBtn" class="lang-btn" onclick="setLanguage('en')">ENG</button>
      </div>
    </div>

    <!-- Izbor datuma -->
    <div class="date-navigation">
      <button class="btn-main" onclick="changeDate(-1)">◀</button>
      <input type="date" id="datePicker" onchange="loadAllTabs()">
      <button class="btn-main" onclick="changeDate(1)">▶</button>
    </div>

    <!-- Navigacija između 4 taba -->
    <div class="tab-navigation">
      <button id="tabDailyBtn" class="tab-btn active" onclick="switchTab('daily')">📖 Dnevno Čitanje</button>
      <button id="tabPlanBtn" class="tab-btn" onclick="switchTab('plan')">📜 Godišnji Plan</button>
      <button id="tabVerseBtn" class="tab-btn" onclick="switchTab('verse')">💎 Stih Ohrabrenja</button>
      <button id="tabQuoteBtn" class="tab-btn" onclick="switchTab('quote')">💡 Mudre Izreke</button>
    </div>

    <!-- TAB 1: Dnevno čitanje -->
    <div id="dailySection">
      <div id="dailyViewMode">
        <div id="dailyDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="dailyShareBtn" class="btn-purple" onclick="shareContent(dailyDisplay.innerText)">📦 Podeli</button>
          <button id="dailyEditBtn" class="btn-main" onclick="enableEdit('daily')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="dailyEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('dailyTextarea')"><b>B</b> Podebljano (Bold)</button>
          <button class="btn-italic" onclick="makeItalic('dailyTextarea')"><i>I</i> Iskošeno (Italic)</button>
        </div>
        <textarea id="dailyTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="dailySaveStatus" class="status"></div>
        <div class="controls">
          <button id="dailyCancelBtn" onclick="cancelEdit('daily')">Otkaži</button>
          <button id="dailySaveBtn" class="btn-main" onclick="saveTabContent('daily')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: Godišnji plan čitanja -->
    <div id="planSection" class="hidden">
      <div id="planViewMode">
        <div id="planDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="planShareBtn" class="btn-purple" onclick="shareContent(planDisplay.innerText)">📦 Podeli</button>
          <button id="planEditBtn" class="btn-main" onclick="enableEdit('plan')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="planEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('planTextarea')"><b>B</b> Podebljano (Bold)</button>
          <button class="btn-italic" onclick="makeItalic('planTextarea')"><i>I</i> Iskošeno (Italic)</button>
        </div>
        <textarea id="planTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="planSaveStatus" class="status"></div>
        <div class="controls">
          <button id="planCancelBtn" onclick="cancelEdit('plan')">Otkaži</button>
          <button id="planSaveBtn" class="btn-main" onclick="saveTabContent('plan')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: Stih ohrabrenja -->
    <div id="verseSection" class="hidden">
      <div id="verseViewMode">
        <div id="verseDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="verseShareBtn" class="btn-purple" onclick="shareContent(verseDisplay.innerText)">📦 Podeli</button>
          <button id="verseEditBtn" class="btn-main" onclick="enableEdit('verse')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="verseEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('verseTextarea')"><b>B</b> Podebljano (Bold)</button>
          <button class="btn-italic" onclick="makeItalic('verseTextarea')"><i>I</i> Iskošeno (Italic)</button>
        </div>
        <textarea id="verseTextarea" placeholder="Unesite tekst..."></textarea>
        <div id="verseSaveStatus" class="status"></div>
        <div class="controls">
          <button id="verseCancelBtn" onclick="cancelEdit('verse')">Otkaži</button>
          <button id="verseSaveBtn" class="btn-main" onclick="saveTabContent('verse')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 4: Mudre izreke -->
    <div id="quoteSection" class="hidden">
      <div id="quoteViewMode">
        <div id="quoteDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button id="quoteShareBtn" class="btn-purple" onclick="shareContent(quoteDisplay.innerText)">📦 Podeli</button>
          <button id="quoteEditBtn" class="btn-main" onclick="enableEdit('quote')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="quoteEditMode" class="hidden">
        <div class="toolbar">
          <button class="btn-bold" onclick="makeBold('quoteTextarea')"><b>B</b> Podebljano (Bold)</button>
          <button class="btn-italic" onclick="makeItalic('quoteTextarea')"><i>I</i> Iskošeno (Italic)</button>
        </div>
        <textarea id="quoteTextarea" placeholder="Unesite mudru izreku..."></textarea>
        <div id="quoteSaveStatus" class="status"></div>
        <div class="controls">
          <button id="quoteCancelBtn" onclick="cancelEdit('quote')">Otkaži</button>
          <button id="quoteSaveBtn" class="btn-main" onclick="saveTabContent('quote')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- Informacije o autoru i kontakt e-mail -->
    <div class="footer">
      <span id="authorText">Autor: Ivica Vučković</span> | 
      <span id="contactText">Kontakt:</span> <a id="emailLink" href="mailto:slugaisusahristosa@gmail.com">slugaisusahristosa@gmail.com</a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://tkwxklzhjvccgszxkxsy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XJ1E7HAtQNXSYCMtCeCk6A_78hqKMEo';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MOJA_SIFRA = '1234';

    let currentLang = 'sr';
    let currentTab = 'daily';

    const translations = {
      sr: {
        appTitle: "Biblijsko Čitanje",
        tabDaily: "📖 Dnevno Čitanje",
        tabPlan: "📜 Godišnji Plan",
        tabVerse: "💎 Stih Ohrabrenja",
        tabQuote: "💡 Mudre Izreke",
        share: "📦 Podeli",
        edit: "⚙️ Uredi",
        cancel: "Otkaži",
        save: "Sačuvaj",
        loading: "Učitavanje...",
        saving: "Čuvanje...",
        emptyDaily: "Nema unetog dnevnog čitanja za ovaj datum.",
        emptyPlan: "Nema unetog godišnjeg plana za ovaj datum.",
        emptyVerse: "Nema unetog stiha ohrabrenja za ovaj datum.",
        emptyQuote: "Nema unete mudre izreke za ovaj datum.",
        placeholder: "Unesite tekst...",
        promptPass: "Unesite šifru za uređivanje:",
        wrongPass: "Pogrešna šifra!",
        copied: "Tekst je kopiran u međuspremnik!",
        author: "Autor: Ivica Vučković",
        contact: "Kontakt:"
      },
      en: {
        appTitle: "Bible Reading",
        tabDaily: "📖 Daily Reading",
        tabPlan: "📜 Yearly Plan",
        tabVerse: "💎 Encouraging Verse",
        tabQuote: "💡 Wise Sayings",
        share: "📦 Share",
        edit: "Edit",
        cancel: "Cancel",
        save: "Save",
        loading: "Loading...",
        saving: "Saving...",
        emptyDaily: "No daily reading added for this date.",
        emptyPlan: "No yearly plan added for this date.",
        emptyVerse: "No encouraging verse added for this date.",
        emptyQuote: "No wise saying added for this date.",
        placeholder: "Enter text...",
        promptPass: "Enter edit PIN:",
        wrongPass: "Incorrect PIN!",
        copied: "Text copied to clipboard!",
        author: "Author: Ivica Vučković",
        contact: "Contact:"
      }
    };

    const datePicker = document.getElementById('datePicker');
    
    // Postavljanje tekućeg datuma
    const d = new Date();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    datePicker.value = `${d.getFullYear()}-${month}-${day}`;

    function makeBold(textareaId) {
      const txtArea = document.getElementById(textareaId);
      const start = txtArea.selectionStart;
      const end = txtArea.selectionEnd;
      const selText = txtArea.value.substring(start, end);

      if (selText.length > 0) {
        const replacement = `<b>${selText}</b>`;
        txtArea.value = txtArea.value.substring(0, start) + replacement + txtArea.value.substring(end);
      } else {
        txtArea.value += "<b>Podebljani tekst</b>";
      }
    }

    function makeItalic(textareaId) {
      const txtArea = document.getElementById(textareaId);
      const start = txtArea.selectionStart;
      const end = txtArea.selectionEnd;
      const selText = txtArea.value.substring(start, end);

      if (selText.length > 0) {
        const replacement = `<i>${selText}</i>`;
        txtArea.value = txtArea.value.substring(0, start) + replacement + txtArea.value.substring(end);
      } else {
        txtArea.value += "<i>Iskošeni tekst</i>";
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'sr') {
        document.getElementById('langSrbBtn').classList.add('active');
        document.getElementById('langEngBtn').classList.remove('active');
      } else {
        document.getElementById('langSrbBtn').classList.remove('active');
        document.getElementById('langEngBtn').classList.add('active');
      }
      applyTranslations();
      loadAllTabs();
    }

    function applyTranslations() {
      const t = translations[currentLang];
      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('tabDailyBtn').textContent = t.tabDaily;
      document.getElementById('tabPlanBtn').textContent = t.tabPlan;
      document.getElementById('tabVerseBtn').textContent = t.tabVerse;
      document.getElementById('tabQuoteBtn').textContent = t.tabQuote;
      document.getElementById('authorText').textContent = t.author;
      document.getElementById('contactText').textContent = t.contact;

      ['daily', 'plan', 'verse', 'quote'].forEach(tab => {
        document.getElementById(`${tab}ShareBtn`).textContent = t.share;
        document.getElementById(`${tab}EditBtn`).textContent = t.edit;
        document.getElementById(`${tab}CancelBtn`).textContent = t.cancel;
        document.getElementById(`${tab}SaveBtn`).textContent = t.save;
        document.getElementById(`${tab}Textarea`).placeholder = t.placeholder;
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      ['daily', 'plan', 'verse', 'quote'].forEach(t => {
        document.getElementById(`${t}Section`).classList.add('hidden');
        document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`).classList.remove('active');
      });

      document.getElementById(`${tab}Section`).classList.remove('hidden');
      document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}Btn`).classList.add('active');
    }

    function getKeysToSearch(tab, dateStr) {
      const monthDay = dateStr.length > 5 ? dateStr.slice(5) : dateStr;
      const prefix = currentLang === 'en' ? 'en_' : '';
      let base = '';

      if (tab === 'plan') base = 'plan_';
      if (tab === 'verse') base = 'stih_';
      if (tab === 'quote') base = 'izreka_';

      return [
        `${prefix}${base}${monthDay}`, // Format MM-DD
        `${prefix}${base}${dateStr}`   // Format YYYY-MM-DD
      ];
    }

    async function loadAllTabs() {
      const selectedDate = datePicker.value;
      if (!selectedDate) return;

      const t = translations[currentLang];

      loadTabContent('daily', selectedDate, 'dailyDisplay', t.emptyDaily);
      loadTabContent('plan', selectedDate, 'planDisplay', t.emptyPlan);
      loadTabContent('verse', selectedDate, 'verseDisplay', t.emptyVerse);
      loadTabContent('quote', selectedDate, 'quoteDisplay', t.emptyQuote);
    }

    async function loadTabContent(tab, date, displayId, emptyText) {
      const displayElem = document.getElementById(displayId);
      displayElem.innerHTML = translations[currentLang].loading;

      const keys = getKeysToSearch(tab, date);

      const { data } = await _supabase
        .from('citanja')
        .select('tekst')
        .in('datum', keys);

      if (data && data.length > 0 && data[0].tekst) {
        displayElem.innerHTML = data[0].tekst;
      } else {
        displayElem.innerHTML = emptyText;
      }
    }

    function enableEdit(tab) {
      const t = translations[currentLang];
      const unetaSifra = prompt(t.promptPass);
      if (unetaSifra !== MOJA_SIFRA) {
        alert(t.wrongPass);
        return;
      }

      const displayElem = document.getElementById(`${tab}Display`);
      const textareaElem = document.getElementById(`${tab}Textarea`);
      const viewElem = document.getElementById(`${tab}ViewMode`);
      const editElem = document.getElementById(`${tab}EditMode`);

      const currentText = displayElem.innerHTML.includes("Nema unetog") || displayElem.innerHTML.includes("No ") ? "" : displayElem.innerHTML;
      textareaElem.value = currentText;

      viewElem.classList.add('hidden');
      editElem.classList.remove('hidden');
    }

    async function saveTabContent(tab) {
      const selectedDate = datePicker.value;
      const keys = getKeysToSearch(tab, selectedDate);
      const dbKey = keys[0]; // Snima se u MM-DD formatu radi kompatibilnosti svake godine

      const textareaElem = document.getElementById(`${tab}Textarea`);
      const statusElem = document.getElementById(`${tab}SaveStatus`);
      const displayElem = document.getElementById(`${tab}Display`);
      const viewElem = document.getElementById(`${tab}ViewMode`);
      const editElem = document.getElementById(`${tab}EditMode`);

      const t = translations[currentLang];
      const newText = textareaElem.value;
      statusElem.textContent = t.saving;

      const { error } = await _supabase
        .from('citanja')
        .upsert({ datum: dbKey, tekst: newText }, { onConflict: 'datum' });

      if (error) {
        alert("Greška: " + error.message);
        statusElem.textContent = "";
      } else {
        statusElem.textContent = "";
        displayElem.innerHTML = newText || (tab === 'daily' ? t.emptyDaily : tab === 'plan' ? t.emptyPlan : tab === 'verse' ? t.emptyVerse : t.emptyQuote);
        editElem.classList.add('hidden');
        viewElem.classList.remove('hidden');
      }
    }

    function cancelEdit(tab) {
      document.getElementById(`${tab}EditMode`).classList.add('hidden');
      document.getElementById(`${tab}ViewMode`).classList.remove('hidden');
    }

    function changeDate(days) {
      const parts = datePicker.value.split('-');
      const currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
      currentDate.setDate(currentDate.getDate() + days);

      const yyyy = currentDate.getFullYear();
      const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
      const dd = String(currentDate.getDate()).padStart(2, '0');
      datePicker.value = `${yyyy}-${mm}-${dd}`;

      loadAllTabs();
    }

    function shareContent(textToShare) {
      const t = translations[currentLang];
      if (navigator.share) {
        navigator.share({
          title: t.appTitle,
          text: textToShare,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(textToShare);
        alert(t.copied);
      }
    }

    applyTranslations();
    loadAllTabs();
  </script>
</body>
</html>
