<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnevno Čitanje & Plan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .tab-navigation {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 8px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .tab-btn.active {
      background-color: #3498db;
      color: white;
    }
    .date-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    button, input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .btn-main {
      background-color: #3498db;
      color: white;
      border: none;
    }
    .btn-purple {
      background-color: #9b59b6;
      color: white;
      border: none;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      line-height: 1.5;
    }
    .display-area {
      min-height: 250px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .hidden {
      display: none;
    }
    .status {
      font-size: 14px;
      color: #666;
      text-align: right;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Izbor datuma (zajednički za sve tabove) -->
    <div class="date-navigation">
      <button class="btn-main" onclick="changeDate(-1)">◀</button>
      <input type="date" id="datePicker" onchange="loadAllTabs()">
      <button class="btn-main" onclick="changeDate(1)">▶</button>
    </div>

    <!-- Navigacija između 3 taba -->
    <div class="tab-navigation">
      <button id="tabDailyBtn" class="tab-btn active" onclick="switchTab('daily')">📖 Dnevno Čitanje</button>
      <button id="tabPlanBtn" class="tab-btn" onclick="switchTab('plan')">📜 Godišnji Plan</button>
      <button id="tabVerseBtn" class="tab-btn" onclick="switchTab('verse')">💎 Stih Ohrabrenja</button>
    </div>

    <!-- TAB 1: Dnevno čitanje -->
    <div id="dailySection">
      <div id="dailyViewMode">
        <div id="dailyDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button class="btn-purple" onclick="shareContent(dailyDisplay.textContent)">📦 Podeli</button>
          <button class="btn-main" onclick="enableEdit('daily')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="dailyEditMode" class="hidden">
        <textarea id="dailyTextarea" placeholder="Unesite tekst za dnevno čitanje..."></textarea>
        <div id="dailySaveStatus" class="status"></div>
        <div class="controls">
          <button onclick="cancelEdit('daily')">Otkaži</button>
          <button class="btn-main" onclick="saveTabContent('daily')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: Godišnji plan čitanja -->
    <div id="planSection" class="hidden">
      <div id="planViewMode">
        <div id="planDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button class="btn-purple" onclick="shareContent(planDisplay.textContent)">📦 Podeli</button>
          <button class="btn-main" onclick="enableEdit('plan')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="planEditMode" class="hidden">
        <textarea id="planTextarea" placeholder="Unesite godišnji plan čitanja za ovaj datum..."></textarea>
        <div id="planSaveStatus" class="status"></div>
        <div class="controls">
          <button onclick="cancelEdit('plan')">Otkaži</button>
          <button class="btn-main" onclick="saveTabContent('plan')">Sačuvaj</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: Stih ohrabrenja -->
    <div id="verseSection" class="hidden">
      <div id="verseViewMode">
        <div id="verseDisplay" class="display-area">Učitavanje...</div>
        <div class="controls">
          <button class="btn-purple" onclick="shareContent(verseDisplay.textContent)">📦 Podeli</button>
          <button class="btn-main" onclick="enableEdit('verse')">⚙️ Uredi</button>
        </div>
      </div>

      <div id="verseEditMode" class="hidden">
        <textarea id="verseTextarea" placeholder="Unesite stih ohrabrenja za ovaj datum..."></textarea>
        <div id="verseSaveStatus" class="status"></div>
        <div class="controls">
          <button onclick="cancelEdit('verse')">Otkaži</button>
          <button class="btn-main" onclick="saveTabContent('verse')">Sačuvaj</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://tkwxklzhjvccgszxkxsy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XJ1E7HAtQNXSYCMtCeCk6A_78hqKMEo';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Šifra za uređivanje
    const MOJA_SIFRA = '1234';

    const datePicker = document.getElementById('datePicker');
    let currentTab = 'daily';

    const today = new Date().toISOString().split('T')[0];
    datePicker.value = today;

    // Promena aktivnog taba
    function switchTab(tab) {
      currentTab = tab;
      
      document.getElementById('dailySection').classList.add('hidden');
      document.getElementById('planSection').classList.add('hidden');
      document.getElementById('verseSection').classList.add('hidden');

      document.getElementById('tabDailyBtn').classList.remove('active');
      document.getElementById('tabPlanBtn').classList.remove('active');
      document.getElementById('tabVerseBtn').classList.remove('active');

      if (tab === 'daily') {
        document.getElementById('dailySection').classList.remove('hidden');
        document.getElementById('tabDailyBtn').classList.add('active');
      } else if (tab === 'plan') {
        document.getElementById('planSection').classList.remove('hidden');
        document.getElementById('tabPlanBtn').classList.add('active');
      } else if (tab === 'verse') {
        document.getElementById('verseSection').classList.remove('hidden');
        document.getElementById('tabVerseBtn').classList.add('active');
      }
    }

    // Određivanje baze podataka (ključ za Supabase)
    function getDbKey(tab, date) {
      if (tab === 'daily') return date;
      if (tab === 'plan') return `plan_${date}`;
      if (tab === 'verse') return `stih_${date}`;
    }

    // Učitavanje podataka za sve tabove za izabrani datum
    async function loadAllTabs() {
      const selectedDate = datePicker.value;

      loadTabContent('daily', selectedDate, 'dailyDisplay', 'Nema unetog dnevnog čitanja za ovaj datum.');
      loadTabContent('plan', selectedDate, 'planDisplay', 'Nema unetog godišnjeg plana za ovaj datum.');
      loadTabContent('verse', selectedDate, 'verseDisplay', 'Nema unetog stiha ohrabrenja za ovaj datum.');
    }

    async function loadTabContent(tab, date, displayId, emptyText) {
      const displayElem = document.getElementById(displayId);
      displayElem.textContent = "Učitavanje...";

      const dbKey = getDbKey(tab, date);

      const { data, error } = await _supabase
        .from('citanja')
        .select('tekst')
        .eq('datum', dbKey)
        .maybeSingle();

      if (error) console.error("Greška pri preuzimanju:", error);

      if (data && data.tekst) {
        displayElem.textContent = data.tekst;
      } else {
        displayElem.textContent = emptyText;
      }
    }

    // Omogućavanje uređivanja
    function enableEdit(tab) {
      const unetaSifra = prompt("Unesite šifru za uređivanje:");
      if (unetaSifra !== MOJA_SIFRA) {
        alert("Pogrešna šifra! Samo administrator može uređivati tekst.");
        return;
      }

      const displayElem = document.getElementById(`${tab}Display`);
      const textareaElem = document.getElementById(`${tab}Textarea`);
      const viewElem = document.getElementById(`${tab}ViewMode`);
      const editElem = document.getElementById(`${tab}EditMode`);

      const currentText = displayElem.textContent.includes("Nema unetog") ? "" : displayElem.textContent;
      textareaElem.value = currentText;

      viewElem.classList.add('hidden');
      editElem.classList.remove('hidden');
    }

    // Čuvanje teksta u bazi
    async function saveTabContent(tab) {
      const selectedDate = datePicker.value;
      const dbKey = getDbKey(tab, selectedDate);
      const textareaElem = document.getElementById(`${tab}Textarea`);
      const statusElem = document.getElementById(`${tab}SaveStatus`);
      const displayElem = document.getElementById(`${tab}Display`);
      const viewElem = document.getElementById(`${tab}ViewMode`);
      const editElem = document.getElementById(`${tab}EditMode`);

      const newText = textareaElem.value;
      statusElem.textContent = "Čuvanje...";

      const { error } = await _supabase
        .from('citanja')
        .upsert({ datum: dbKey, tekst: newText }, { onConflict: 'datum' });

      if (error) {
        alert("Greška pri čuvanju: " + error.message);
        statusElem.textContent = "";
      } else {
        statusElem.textContent = "";
        displayElem.textContent = newText || "Nema unetog teksta za ovaj datum.";
        editElem.classList.add('hidden');
        viewElem.classList.remove('hidden');
      }
    }

    function cancelEdit(tab) {
      document.getElementById(`${tab}EditMode`).classList.add('hidden');
      document.getElementById(`${tab}ViewMode`).classList.remove('hidden');
    }

    function changeDate(days) {
      const currentDate = new Date(datePicker.value);
      currentDate.setDate(currentDate.getDate() + days);
      datePicker.value = currentDate.toISOString().split('T')[0];
      loadAllTabs();
    }

    function shareContent(textToShare) {
      if (navigator.share) {
        navigator.share({
          title: 'Biblijsko Čitanje',
          text: textToShare,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(textToShare);
        alert("Tekst je kopiran u međuspremnik!");
      }
    }

    // Inicijalno učitavanje
    loadAllTabs();
  </script>
</body>
</html>
